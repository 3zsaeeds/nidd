<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>نِدّ | Nidd</title>
  <meta name="description" content="سجّل تمارينك وتابع تقدّمك في الجيم">
  <meta name="apple-mobile-web-app-title" content="نِدّ">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/config.js?v=a0c7168f"></script>
  <script>
  (function () {
    if (window.NIDD_OS) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      var s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true; document.head.appendChild(s);
      OneSignalDeferred.push(function (O) {
        return O.init({ appId: window.NIDD_OS, serviceWorkerPath: 'sw.js', serviceWorkerParam: { scope: '/' }, notifyButton: { enable: false } }).then(function () {
          O.Notifications.addEventListener('foregroundWillDisplay', function (e) {
            var d = (e.notification && e.notification.additionalData) || {};
            if (d.type === 'rest' && document.visibilityState === 'visible') e.preventDefault();
          });
        });
      });
    } else if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  })();

  <meta name="theme-color" content="#0B0F1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
:root{
  --bg:#0B0F1A;--c1:#141827;--c2:#1F2438;--c3:#2E3552;--mut:#8A93A6;--tx:#E6ECF2;
  --pink:#FF3B8D;--pur:#7B3CFF;--cyan:#00C2FF;--org:#FF8A00;--teal:#00E0B8;--yel:#FFD34D;
  --grad:linear-gradient(270deg,#FF8A00 0%,#FF3B8D 35%,#7B3CFF 68%,#00C2FF 100%);
  --grad2:linear-gradient(135deg,#FF3B8D,#7B3CFF);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(520px 260px at 100% -40px,rgba(123,60,255,.20),transparent 70%),
  radial-gradient(420px 260px at -10% 0,rgba(255,59,141,.12),transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(100px + env(safe-area-inset-bottom))}
#app>*+*{margin-top:14px}
button{font-family:inherit;cursor:pointer}
.en{direction:ltr;unicode-bidi:isolate}
h1{font-size:26px;font-weight:800;margin:0;line-height:1.25}
h2{font-size:19px;font-weight:700;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}.b{font-weight:700}
.center{text-align:center}.w100{width:100%}
.text-danger{color:#FF5C8A!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.card{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:14px}
.card.warn{border-color:rgba(255,138,0,.35)}
.card h3{margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card.mini{padding:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:20px!important}
.pg-h{margin-top:6px}

/* أزرار */
.btn{appearance:none;border:0;border-radius:16px;height:54px;padding:0 18px;font-weight:700;font-size:17px;color:#fff;background:var(--grad);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn i{font-size:20px}
.btn.ghost{background:rgba(0,194,255,.05);border:1.5px solid #1E5A9E;color:#8FD3FF}
.btn.dark{background:var(--c2);color:var(--tx)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.text-danger{background:transparent}
.btn:disabled{opacity:.55}
.btn:active,.list-item:active,.stat:active,.hero-card:active{transform:scale(.985)}
.link{background:none;border:0;color:#8FD3FF;font-size:15px;padding:6px;width:100%}
.link.sm{width:auto;font-size:13px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:13px;background:var(--c1);border:1px solid var(--c2);color:var(--tx);display:grid;place-items:center;font-size:20px;padding:0}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;font-size:17px}
.icon-btn.danger{color:#FF5C8A}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* حقول */
input,select{width:100%;height:50px;border-radius:14px;border:1px solid var(--c3);background:var(--c1);color:var(--tx);padding:0 14px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 22px,24px 22px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(123,60,255,.25)}
input::placeholder{color:#5D6680}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 4px 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut)}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pur);-webkit-appearance:auto;appearance:auto}
.search{position:relative}.search i{position:absolute;right:14px;top:15px;color:var(--mut);font-size:20px}.search input{padding-right:42px}

/* تبويبات وشرائح */
.seg{display:flex;background:var(--c1);border:1px solid var(--c2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:14px;height:38px;border-radius:10px;white-space:nowrap;padding:0 12px}
.seg button.on{background:linear-gradient(135deg,#00C2FF,#2F6BFF);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--c2);color:var(--tx);font-size:13px;font-weight:700;border:0;white-space:nowrap;flex:none}
.chip.on{background:var(--grad2)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500}

/* شريط التنقل */
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;display:flex;background:rgba(20,24,39,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--c2);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button i{font-size:25px}
.nav button.on{color:var(--org)}
.nav button.on i{color:var(--yel)}

/* أعلى الشاشة */
.topbar{display:flex;align-items:center;gap:10px;min-height:44px}
.topbar h2{text-align:right}
.home-h h1{font-size:28px}

/* البطاقات الرئيسية */
.hero-card{position:relative;overflow:hidden;border-radius:22px;padding:18px;min-height:118px;background:linear-gradient(120deg,#FF3B8D 0%,#9B3CF0 55%,#7B3CFF 100%);display:block;width:100%;text-align:right;border:0;color:#fff}
.hero-card.alt{background:linear-gradient(120deg,#1F2438,#2E3552)}
.hero-card.resume{background:linear-gradient(120deg,#FF8A00,#FF3B8D)}
.hc-title{font-size:26px;font-weight:800;line-height:1.2;position:relative;z-index:1}
.hc-meta{font-size:13px;opacity:.92;margin-top:4px;position:relative;z-index:1}
.hc-go{position:absolute;left:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);color:#7B3CFF;display:grid;place-items:center;font-size:22px;z-index:1}
.hc-deco{position:absolute;left:-6px;top:-18px;font-size:128px;opacity:.16}
.hero-card .chip{margin-top:12px;background:rgba(255,255,255,.18);color:#fff}

.note{display:flex;align-items:center;gap:8px;background:rgba(255,211,77,.08);border:1px solid rgba(255,211,77,.25);color:#FFE38A;border-radius:14px;padding:10px 12px;font-size:14px}
.note .chip{margin-right:auto;height:30px}

.bar{height:8px;border-radius:99px;background:var(--c2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(270deg,#FF8A00,#FF3B8D,#7B3CFF);border-radius:99px}

.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:12px 8px;text-align:center;color:var(--tx);width:100%}
.stat i{font-size:28px}
.sv{font-size:22px;font-weight:800;margin-top:4px;line-height:1.2}
.sv small{font-size:12px;font-weight:500;margin-right:2px}
.sl{font-size:12px;color:var(--mut)}
.big2{font-size:30px;font-weight:800;line-height:1.2}
.big3{font-size:24px;font-weight:800}
.big3 small{font-size:13px;font-weight:500}
.delta{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:2px}

/* القوائم */
.list-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--c1);border:1px solid var(--c2);border-radius:16px;width:100%;color:var(--tx);text-align:right}
.list-item.done{border-color:rgba(0,224,184,.4)}
.thumb{width:48px;height:48px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:24px}
.pr{font-weight:800;color:var(--yel)}
.tpl{display:block;width:100%;text-align:right;background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:14px;color:var(--tx)}
.tpl>*+*{margin-top:8px}

/* تعديل البرنامج */
.edit-nums{margin-top:10px;align-items:flex-end}
.edit-nums input{height:42px;text-align:center}
.mini-step{display:flex;align-items:center;gap:6px;text-align:center}
.mini-step button{width:34px;height:42px;border-radius:10px;border:0;background:var(--c2);color:var(--tx);font-size:16px}
.mini-step b{font-size:20px}

/* صفحة التمرين */
.ex-hero{position:relative;border-radius:22px;padding:14px;min-height:178px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(90% 100% at 15% 15%,var(--c),transparent 65%),linear-gradient(135deg,#2E3552,#141827)}
.ex-hero>*{position:relative;z-index:1}
.ex-hero h1{font-size:28px;margin-bottom:8px}
.ex-hero .tag{background:rgba(0,0,0,.28)}
.ex-deco{position:absolute!important;left:-10px;top:-6px;font-size:150px;opacity:.14;z-index:0!important}
.mmap{display:flex;justify-content:center;gap:18px;margin-top:4px}
.mmap figure{margin:0;text-align:center}
.mmap svg{width:118px;height:auto}
.mmap figcaption{font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* جلسة التمرين */
.ring{position:relative;margin:0 auto}
.ring svg{width:100%;height:100%;display:block}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:60px;font-weight:800;line-height:1}
.last{text-align:center;background:var(--c1);border:1px dashed var(--c3);border-radius:14px;padding:8px 10px}
.sug{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--teal);font-weight:700}
.steppers{display:grid;grid-template-columns:1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--c2);border-radius:18px;padding:8px}
.stepper button{width:54px;height:54px;flex:none;border-radius:14px;border:0;background:var(--c2);color:var(--tx);font-size:22px}
.num{height:42px!important;border:0!important;background:transparent!important;text-align:center;font-size:30px!important;font-weight:800;padding:0!important;box-shadow:none!important}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--c2)}
.set-row:last-child{border-bottom:0}
.set-row .mut{width:76px;font-size:13px}

/* الجدول */
.week{display:flex;gap:6px}
.wd{flex:1;text-align:center;padding:8px 0;border-radius:14px;background:var(--c1);border:1px solid var(--c2);display:flex;flex-direction:column;gap:2px;font-size:11px}
.wd b{font-size:16px}
.wd.on{background:var(--grad2);border-color:transparent}
.wd .dot{width:5px;height:5px;border-radius:50%;background:var(--org);margin:0 auto}
.sched{display:flex;align-items:center;gap:12px;width:100%;background:var(--c1);border:1px solid var(--c2);border-radius:18px;padding:10px;color:var(--tx);text-align:right}
.sched.today{border-color:var(--pur)}
.sched-d{width:62px;flex:none;font-size:14px}
.sched-c{flex:1;border-radius:14px;padding:10px 12px;background:linear-gradient(120deg,#FF3B8D,#7B3CFF);color:#fff}
.sched-c.rest{background:var(--c2);color:var(--tx)}

/* المزيد */
.profile{display:flex;align-items:center;gap:12px;width:100%;background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:12px;color:var(--tx);text-align:right}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--grad2);display:grid;place-items:center;font-weight:800;font-size:18px}
.menu{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--c2);color:var(--tx);font-size:15px;text-align:right}
.menu button:last-child{border-bottom:0}
.mi{font-size:22px;color:#9B7BFF}

/* شاشات الدخول */
.hero-wall{position:relative;min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden;padding:28px 20px;background:#0B0F1A;display:flex;flex-direction:column}
.hero-wall::before{content:"";position:absolute;inset:-25%;z-index:0;background:
  radial-gradient(38% 30% at 18% 28%,rgba(255,59,141,.55),transparent 70%),
  radial-gradient(40% 32% at 88% 42%,rgba(123,60,255,.6),transparent 70%),
  radial-gradient(42% 30% at 28% 86%,rgba(255,138,0,.45),transparent 70%),
  radial-gradient(34% 28% at 82% 92%,rgba(0,194,255,.35),transparent 70%);filter:blur(8px)}
.hero-wall>*{position:relative;z-index:1}
.wordmark{display:flex;align-items:center;gap:14px;font-size:42px;font-weight:800;line-height:1}
.wordmark i{width:2px;height:36px;background:linear-gradient(#FF3B8D,#00C2FF);border-radius:2px}
.slogan{letter-spacing:.35em;font-size:14px;color:#C9D1E0}
.auth-logo{display:flex;justify-content:center;margin:8px 0 4px}

/* الرسوم */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.empty-chart{padding:22px 0;text-align:center}

/* النوافذ والتنبيهات */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,14,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--c1);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:1px solid var(--c3);animation:up .22s ease}
.sheet>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trophy{font-size:64px;text-align:center;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--c2);border:1px solid var(--c3);padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:90%;text-align:center;animation:fade .2s ease}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:right;z-index:70;transition:transform .25s}
#busy.on{transform:scaleX(.85);transition:transform 6s cubic-bezier(.1,.6,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* الاشتراك والتعديل */
a.btn{text-decoration:none}
.btn.wa{background:linear-gradient(135deg,#25D366,#00A884);color:#fff}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plan{background:var(--c1);border:1px solid var(--c3);border-radius:var(--r);padding:12px;text-align:center}
.plan-p{font-size:22px;font-weight:800;color:var(--yel);margin-top:2px}
.plan-p small{font-size:12px;font-weight:500;color:var(--mut)}
.plan-edit{display:flex;gap:8px;align-items:flex-end}
.plan-edit input{height:42px}
.set-edit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c2)}
.set-edit:last-child{border-bottom:0}
.set-edit .chip{width:86px;justify-content:center;flex:none}
.set-edit input{height:42px;text-align:center;padding:0 6px;min-width:0;flex:1}
.stat.sel{border-color:var(--pur);box-shadow:0 0 0 2px rgba(123,60,255,.3) inset}

/* ===== v1.1: أزرار فوق، جلسة بالجدول، المصمّم ===== */
.actions{display:flex;gap:10px;align-items:center}
.actions .btn{flex:1}
.icon-btn.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.btn.light{background:#fff;color:#7B3CFF;margin-top:14px;position:relative;z-index:1}
.btn.dashed{background:transparent;border:1.5px dashed var(--c3);color:var(--mut);height:50px}
.btn.glow{box-shadow:0 0 0 3px rgba(0,224,184,.35),0 8px 24px rgba(123,60,255,.35);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(0,224,184,.15),0 8px 24px rgba(123,60,255,.35)}}
.plain{background:none;border:0;color:inherit;text-align:right;padding:0;font:inherit;min-width:0}
.list-item.slim{padding:8px}
.list-item.slim .thumb{width:38px;height:38px;font-size:19px;border-radius:11px}
.list-item .chip{flex:none}
.seg button[data-act="addDay"]{flex:none;width:42px;padding:0}
textarea{width:100%;border-radius:14px;border:1px solid var(--c3);background:var(--c1);color:var(--tx);padding:12px 14px;font:inherit;font-size:16px;outline:none;resize:vertical}
textarea:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(123,60,255,.25)}
.card.hl{border-color:rgba(123,60,255,.55);background:linear-gradient(135deg,rgba(123,60,255,.12),rgba(255,59,141,.06)),var(--c1)}
.card.hl .row{margin-top:10px}
.card.hl .btn{flex:1}
.restbar{background:linear-gradient(120deg,rgba(0,194,255,.14),rgba(123,60,255,.14));border:1px solid rgba(0,194,255,.35);border-radius:16px;padding:10px 12px;position:sticky;top:8px;z-index:15;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.restbar .row{gap:6px}
.restbar .big3{text-align:center}
.restbar .chip{height:30px;padding:0 10px}
.restbar .bar{margin-top:8px}
.restbar .bar>i{background:linear-gradient(270deg,#00C2FF,#7B3CFF);transition:width 1s linear}

<body>

  <script>
(function () {
'use strict';

/* ===================== ثوابت ===================== */
var MUS = { chest: 'صدر', back: 'ظهر', shoulders: 'أكتاف', biceps: 'بايسبس', triceps: 'ترايسبس', forearms: 'ساعد', quads: 'أرجل أمامية', hamstrings: 'أرجل خلفية', glutes: 'مؤخرة', calves: 'سمانة', abs: 'بطن' };
var MUS_COLOR = { chest: '#FF3B8D', back: '#7B3CFF', shoulders: '#00C2FF', biceps: '#FF8A00', triceps: '#FF8A00', forearms: '#FF8A00', quads: '#00E0B8', hamstrings: '#00E0B8', glutes: '#00E0B8', calves: '#00E0B8', abs: '#FFD34D' };
var EQ = { machine: 'جهاز', barbell: 'بار', dumbbell: 'دمبل', cable: 'كيبل', bodyweight: 'وزن الجسم', smith: 'سميث', kettlebell: 'كيتل بل' };
var EQ_STEP = { machine: 5, barbell: 2.5, dumbbell: 2, cable: 2.5, bodyweight: 2.5, smith: 2.5, kettlebell: 4 };
var TY = { compound: 'مركّب', isolation: 'عزل', time: 'بالوقت' };
var GOALS = { cut: 'تنشيف', bulk: 'بناء عضل', maintain: 'محافظة' };
var MON = ['ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف', 'ديس'];
var WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
var DTYPES = [
  ['rest', 'راحة', 'zzz'], ['push', 'Push', 'arrow-bar-up'], ['pull', 'Pull', 'arrow-bar-down'], ['legs', 'Legs', 'walk'],
  ['upper', 'Upper', 'arrow-up'], ['lower', 'Lower', 'arrow-down'], ['full', 'Full Body', 'body-scan'],
  ['chest', 'صدر', 'heart'], ['back', 'ظهر', 'shield'], ['shoulders', 'أكتاف', 'triangle'], ['arms', 'ذراع', 'barbell'],
  ['custom', 'يوم فاضي، أختار تماريني', 'pencil-plus']
];
var RC = 2 * Math.PI * 52;

/* ===================== تخزين محلي ===================== */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('nidd_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('nidd_' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('nidd_' + k); } catch (e) {} }
};

var S = {
  token: LS.get('token', null), boot: null, route: 'splash', params: {}, stack: [],
  draft: LS.get('draft', null), queue: LS.get('queue', []), tab: {}, ex: {},
  libQ: '', libM: '', admin: null, adminF: 'pending', who: null, sEdit: null,
  summary: null, build: null, progVer: 0, sw: null
};
if (S.draft && (!S.draft.items || S.draft.items.some(function (it) { return !it.rows; }))) { S.draft = null; LS.del('draft'); }

function setBoot(b) {
  S.boot = b; S.ex = {};
  (b.library || []).forEach(function (e) { S.ex[e.id] = e; });
  LS.set('boot', b);
}
(function () { var b = LS.get('boot', null); if (b && S.token) setBoot(b); })();
function saveDraft() { LS.set('draft', S.draft); }

/* ===================== أدوات ===================== */
function $(id) { return document.getElementById(id); }
function val(id) { var el = $(id); return el ? String(el.value).trim() : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pj(o) { return esc(JSON.stringify(o)); }
function ic(n, cls) { return '<i class="ti ti-' + n + ' ' + (cls || '') + '" aria-hidden="true"></i>'; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
function fmtN(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
function r1(v) { return Math.round(v * 10) / 10; }
function r2(v) { return Math.round(v * 100) / 100; }
function fmtSec(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + pad(s % 60); }
function fmtDur(ms) { var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); }
function initials(n) { return String(n || '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join(''); }
function estMin(d) { var s = 0; d.items.forEach(function (it) { s += +it.sets; }); return Math.max(10, Math.round(s * 2.7)); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isTime(e) { return !!e && (e.type === 'time' || e.id === 'plank' || e.id === 'side-plank'); }
function stepOf(e) { return EQ_STEP[(e || {}).equip] || 2.5; }
function exOf(id) { return S.ex[id] || { id: id, name: id }; }
function videoUrl(e) { return e.video || ('https://www.youtube.com/results?search_query=' + encodeURIComponent(e.name + ' exercise form')); }
function daysAr(n) { return n === 1 ? 'يوم واحد' : n === 2 ? 'يومين' : (n >= 3 && n <= 10 ? n + ' أيام' : n + ' يوم'); }

/* ===================== الاتصال بالسيرفر ===================== */
var busyN = 0;
function busy(d) { busyN = Math.max(0, busyN + d); var b = $('busy'); if (b) b.className = busyN ? 'on' : ''; }

function call(action, payload, o) {
  o = o || {};
  if (!o.quiet) busy(1);
  return new Promise(function (res, rej) {
    function done(r) {
      if (!o.quiet) busy(-1);
      if (r && r.ok) return res(r.data);
      var e = new Error((r && r.error) || 'حدث خطأ غير متوقع');
      e.code = r && r.code;
      if (S.token && ['AUTH', 'EXPIRED', 'SUSPENDED', 'PENDING'].indexOf(e.code) >= 0) handleBlocked(e);
      rej(e);
    }
    function fail() { if (!o.quiet) busy(-1); rej(new Error('تعذّر الاتصال، تأكد من الإنترنت')); }
    if (window.NIDD_API) { // التطبيق المستضاف: نكلّم السيرفر بـ fetch
      fetch(window.NIDD_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: S.token, payload: payload || {} }) })
        .then(function (r) { return r.json(); }).then(done).catch(fail);
    } else {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, S.token, payload || {});
    }
  });
}

/* ===================== التثبيت والتنبيهات ===================== */
var HOSTED = !!window.NIDD_API;
var UA = navigator.userAgent || '';
var IOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
var ANDROID = /android/i.test(UA);
var installEvt = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (['home', 'welcome', 'notify'].indexOf(S.route) >= 0) render(); });
window.addEventListener('appinstalled', function () { installEvt = null; render(); });
function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function osDo(fn) { if (window.NIDD_OS && window.OneSignalDeferred) window.OneSignalDeferred.push(fn); }
/** حالة التنبيهات على هذا الجهاز */
function pushState() {
  if (!HOSTED || !window.NIDD_OS) return 'off';
  if (IOS && !standalone()) return 'install';
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  if (Notification.permission === 'granted' && S.boot && S.boot.notif && S.boot.notif.on) return 'on';
  return 'ask';
}
function pushLogin() { if (S.boot && S.boot.user) { var id = S.boot.user.id; osDo(function (O) { return O.login(id); }); } }
function pushLogout() { osDo(function (O) { return O.logout(); }); }
function savePrefs(p, msg) {
  S.boot.notif = Object.assign({}, S.boot.notif || {}, p); LS.set('boot', S.boot);
  return call('notifPrefs', { prefs: p }, { quiet: true }).then(function (r) { S.boot.notif = r.prefs; LS.set('boot', S.boot); if (msg) toast(msg); })
    .catch(function (e) { toast(e.message); });
}
function enablePush() {
  if (!window.OneSignalDeferred) return toast('التنبيهات غير متاحة الحين');
  osDo(function (O) {
    return O.Notifications.requestPermission().then(function () {
      if (Notification.permission !== 'granted') { render(); return toast('ما انعطت الصلاحية. فعّلها من إعدادات الجوال'); }
      pushLogin();
      savePrefs({ on: 1 }, 'تم تفعيل التنبيهات 🔔').then(render);
    });
  });
}
function pushOn(kind) { var n = S.boot && S.boot.notif; return HOSTED && n && n.on && n[kind] && typeof Notification !== 'undefined' && Notification.permission === 'granted'; }
/** تنبيه مؤجّل من السيرفر (يوصل والشاشة مقفلة) */
function pushLater(kind, sec, text) {
  if (!pushOn(kind)) return Promise.resolve('');
  return call('pushLater', { kind: kind, sec: sec, text: text || '' }, { quiet: true }).then(function (r) { return r.id || ''; }).catch(function () { return ''; });
}
function pushCancel(ids) {
  ids = [].concat(ids || []).filter(Boolean);
  if (ids.length) call('pushCancel', { ids: ids }, { quiet: true }).catch(function () {});
}
function schedRest() {
  var d = S.draft; if (!d) return;
  var old = d.restPush; d.restPush = ''; pushCancel(old);
  if (!d.restEnd) return saveDraft();
  var sec = Math.round((d.restEnd - Date.now()) / 1000), it = d.items[d.cur], nx = '';
  if (it) {
    var row = null; it.rows.some(function (r) { if (!r.done) { row = r; return true; } return false; });
    nx = row ? 'المجموعة الجاية: ' + it.name : (d.items[d.cur + 1] ? 'التمرين الجاي: ' + d.items[d.cur + 1].name : 'آخر مجموعة خلصت، اضغط إنهاء 🏁');
  }
  var tag = d.restEnd; saveDraft();
  pushLater('rest', sec, nx).then(function (id) {
    if (S.draft && S.draft.restEnd === tag) { S.draft.restPush = id; saveDraft(); } else pushCancel(id);
  });
}
function schedForgot() {
  var d = S.draft; if (!d) return;
  var old = d.forgotPush; d.forgotPush = ''; d.forgotAt = Date.now(); pushCancel(old); saveDraft();
  var sid = d.id;
  pushLater('forgot', 7200).then(function (id) { if (S.draft && S.draft.id === sid) { S.draft.forgotPush = id; saveDraft(); } else pushCancel(id); });
}
function installCard(small) {
  if (!HOSTED || standalone() || LS.get('instHide', 0) > Date.now()) return '';
  var how;
  if (installEvt) how = '<button class="btn sm" data-act="install">' + ic('download') + ' ثبّت نِدّ</button>';
  else if (IOS) how = '<ol class="steps"><li>اضغط زر المشاركة ' + ic('share-2') + ' في Safari</li><li>اختر «إضافة إلى الشاشة الرئيسية» ' + ic('square-plus') + '</li><li>افتح نِدّ من الأيقونة</li></ol>';
  else how = '<ol class="steps"><li>من قائمة المتصفح ' + ic('dots-vertical') + '</li><li>اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»</li></ol>';
  return '<div class="card hl install"><div class="row between"><h3 style="margin:0">' + ic('device-mobile') + ' ثبّت نِدّ على جوالك</h3>' +
    '<button class="icon-btn sm" data-act="instHide" aria-label="إخفاء">' + ic('x') + '</button></div>' +
    (small ? '' : '<p class="sm mut">يصير مثل التطبيق: أيقونة، شاشة كاملة، وتنبيهات حتى والشاشة مقفلة.</p>') + how + '</div>';
}
function pushCard() {
  var st = pushState();
  if (st !== 'ask' || LS.get('pushHide', 0) > Date.now()) return '';
  return '<div class="card hl"><div class="row between"><h3 style="margin:0">' + ic('bell-ringing') + ' فعّل التنبيهات</h3><button class="icon-btn sm" data-act="pushHide" aria-label="إخفاء">' + ic('x') + '</button></div>' +
    '<p class="sm mut">تنبيه لما تخلص الراحة حتى والشاشة مقفلة، وتذكير بأيام تمرينك.</p><button class="btn sm" data-act="enablePush">' + ic('bell') + ' فعّل</button></div>';
}

function handleBlocked(e) {
  if (e.code === 'AUTH') {
    S.token = null; LS.del('token'); LS.del('boot');
    go('login', {}, { root: true });
    toast('انتهت الجلسة، سجّل دخولك من جديد');
  } else {
    if (S.boot) S.who = { name: S.boot.user.name, phone: S.boot.user.phone };
    go('blocked', { code: e.code }, { root: true });
  }
}

function flushQueue() {
  var prs = [];
  function next() {
    if (!S.queue.length) {
      if (['home', 'progress', 'program', 'more'].indexOf(S.route) >= 0) render();
      return Promise.resolve({ prs: prs });
    }
    return call('saveSession', { session: S.queue[0] }).then(function (r) {
      S.queue.shift(); LS.set('queue', S.queue);
      prs = prs.concat(r.prs || []);
      if (r.boot) setBoot(r.boot);
      return next();
    });
  }
  return next();
}

/** حفظ البرنامج بعد أي تعديل (تحديث فوري على الشاشة، والسيرفر بالخلفية) */
function saveProg(msg) {
  var v = ++S.progVer, days = clone(S.boot.program || []);
  LS.set('boot', S.boot);
  return call('saveProgram', { days: days }).then(function (b) {
    if (v !== S.progVer) { b.program = S.boot.program; }
    setBoot(b);
    if (msg) toast(msg);
  }).catch(function (e) { toast(e.message); });
}

/* ===================== التنقل ===================== */
var TABS = ['home', 'program', 'progress', 'more'];
function go(route, params, opts) {
  opts = opts || {};
  closeSheet();
  if (opts.root) S.stack = [];
  else if (!opts.replace && S.route && S.route !== 'splash') S.stack.push([S.route, S.params]);
  S.route = route; S.params = params || {};
  render();
  window.scrollTo(0, 0);
}
function back() {
  closeSheet();
  var p = S.stack.pop();
  if (p) { S.route = p[0]; S.params = p[1]; render(); window.scrollTo(0, 0); }
  else go(S.token && S.boot ? 'home' : 'welcome', {}, { root: true });
}
function render() {
  var fn = SC[S.route] || SC.home;
  var open = ['splash', 'welcome', 'login', 'register', 'forgot', 'blocked', 'privacy'].indexOf(S.route) >= 0;
  if (!open && !S.boot) { S.route = 'splash'; fn = SC.splash; }
  $('app').innerHTML = fn(S.params || {});
  if (S.route === 'library' && S.libQ) filterLib(S.libQ);
}

/* ===================== مكونات ===================== */

    '<linearGradient id="lgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A00"/><stop offset="1" stop-color="#FF3B8D"/></linearGradient></defs>' +

  return logo(108) + '<div class="wordmark"><span>نِدّ</span><i></i><span class="en">Nidd</span></div><div class="slogan en">All You Nidd</div>';
}

}

/* ===================== حسابات ===================== */
function weekCount() {
  var n = new Date(), sun = new Date(n.getFullYear(), n.getMonth(), n.getDate() - n.getDay()), from = ymd(sun);
  return (S.boot.sessions || []).filter(function (s) { return s.date >= from; }).length;
}
function trainDays() { var s = S.boot.settings.schedule || {}, n = 0; for (var k in s) if (s[k]) n++; return n; }
function todayPlan() {
  var b = S.boot, p = b.program || [];
  if (!p.length) return { none: true };
  var sch = b.settings.schedule || {}, has = Object.keys(sch).some(function (k) { return sch[k]; });
  var day = null, rest = false;
  if (has) {
    var id = sch[new Date().getDay()];
    day = p.filter(function (d) { return d.id === id; })[0] || null;
    rest = !day;
  } else {
    var last = (b.sessions || [])[0], idx = 0;
    if (last) { var i = p.map(function (d) { return d.id; }).indexOf(last.dayId); idx = i >= 0 ? (i + 1) % p.length : 0; }
    day = p[idx];
  }
  var doneToday = (b.sessions || []).some(function (s) { return s.date === ymd() && (!day || s.dayId === day.id); });
  return { day: day, rest: rest, doneToday: doneToday };
}
function lastSets(exId) { var l = S.boot.last[exId]; return l ? l.sets : []; }
function calcT(u, w, act) {
  var base = 10 * w + 6.25 * u.height - 5 * u.age + (u.gender === 'female' ? -161 : 5);
  var adj = { cut: -500, bulk: 300, maintain: 0 }[u.goal] || 0;
  return { cal: Math.round((base * act + adj) / 10) * 10, prot: Math.round(w * (u.goal === 'bulk' ? 1.8 : 2)) };
}
function latestWeight() {
  var ws = (S.boot.body || []).filter(function (r) { return r.weight > 0; });
  return ws.length ? ws[ws.length - 1].weight : null;
}
function nutOn(date) {
  var c = 0, p = 0;
  (S.boot.nutrition || []).forEach(function (r) { if (r.date === date) { c += +r.calories || 0; p += +r.protein || 0; } });
  return { cal: c, pro: r1(p) };
}

/* ===================== الجلسة ===================== */
function makeRows(exId, n) {
  var prev = lastSets(exId), rows = [];
  for (var i = 0; i < n; i++) rows.push({ w: '', r: '', wu: !!(prev[i] && prev[i].wu), done: false });
  return rows;
}
function sessItem(exId, t) {
  var e = exOf(exId);
  return { exId: exId, name: e.name, target: { sets: +t.sets, min: +t.min, max: +t.max }, rows: makeRows(exId, +t.sets) };
}
function doneWork(it) { return it.rows.filter(function (r) { return r.done && !r.wu; }).length; }
function doneAll(it) { return it.rows.length > 0 && it.rows.every(function (r) { return r.done; }); }
function sessTotals() {
  var d = S.draft, done = 0, tot = 0;
  d.items.forEach(function (it) { done += it.rows.filter(function (r) { return r.done; }).length; tot += it.rows.length; });
  return { done: done, tot: tot };
}
function firstOpen() {
  var d = S.draft;
  for (var i = 0; i < d.items.length; i++) if (!doneAll(d.items[i])) return i;
  return Math.max(0, d.items.length - 1);
}
function restBar() {
  var d = S.draft;
  if (!d || !d.restEnd || d.restEnd <= Date.now()) return '';
  var rem = Math.ceil((d.restEnd - Date.now()) / 1000), f = rem / Math.max(1, d.restTotal);
  return '<div class="restbar"><div class="row"><span class="b">' + ic('hourglass') + ' الراحة</span><span class="big3 en grow" id="restTxt">' + fmtSec(rem) + '</span>' +
    '<button class="chip" data-act="restAdj" data-d="-15">−15</button><button class="chip" data-act="restAdj" data-d="15">+15</button><button class="chip on" data-act="skipRest">تخطّي</button></div>' +
    '<div class="bar"><i id="restFill" style="width:' + (f * 100).toFixed(1) + '%"></i></div></div>';
}

/** نصايح الجلسة الجاية */
function buildTips(items) {
  var out = [];
  items.forEach(function (it) {
    var e = exOf(it.exId), work = it.rows.filter(function (r) { return r.done && !r.wu; });
    if (!work.length) return;
    var t = it.target, n = work.length, step = stepOf(e);
    var mxW = Math.max.apply(null, work.map(function (r) { return +r.w || 0; }));
    var allTop = work.every(function (r) { return +r.r >= t.max; });
    var low = work.filter(function (r) { return +r.r < t.min; }).length;
    var veryLow = work.every(function (r) { return +r.r < t.min - 2; });
    var tip;
    if (isTime(e)) {
      if (allTop) tip = ['up', 'زد 10 ثواني، هدفك ' + (t.max + 10) + ' ثانية'];
      else if (low > n / 2) tip = ['keep', 'ثبّت المدة وحاول توصل ' + t.min + ' ثانية بكل المجموعات'];
      else tip = ['keep', 'حاول توصل ' + t.max + ' ثانية بكل المجموعات'];
    } else if (!mxW) {
      tip = allTop ? ['up', 'ممتاز! زد عدّتين أو أضف وزن خفيف'] : ['keep', 'حاول توصل ' + t.max + ' عدّة بكل المجموعات'];
    } else if (allTop) {
      tip = ['up', 'شيلها لا تفشّلنا! جرّب ' + r2(mxW + step) + ' كجم (+' + step + ')'];
    } else if (veryLow && mxW > step) {
      tip = ['down', 'خفّف لـ ' + r2(mxW - step) + ' كجم وارجع لنطاق ' + t.min + '-' + t.max + ' عدّة'];
    } else if (low > n / 2) {
      tip = ['keep', 'ثبّت ' + mxW + ' كجم وركّز توصل ' + t.min + ' عدّات على الأقل'];
    } else {
      tip = ['keep', 'ثبّت ' + mxW + ' كجم وحاول توصل ' + t.max + ' عدّة بكل المجموعات'];
    }
    if (n < t.sets) tip[1] += '. سجّلت ' + n + ' من ' + t.sets + ' مجموعات';
    out.push({ name: it.name, kind: tip[0], text: tip[1] });
  });
  return out;
}

SC.progress = function () {
  var b = S.boot, per = S.tab.period || 'month';
  var days = { week: 7, month: 30, year: 365 }[per], from = ymd(new Date(Date.now() - days * 864e5)), sun = new Date();
  sun.setDate(sun.getDate() - sun.getDay());
  if (per === 'week') from = ymd(sun);
  var sess = (b.sessions || []).filter(function (s) { return s.date >= from; }), vol = 0, sets = 0;
  sess.forEach(function (s) { vol += s.volume; sets += s.sets; });
  var series = [], labels = [], i, dt;
  if (per === 'week') {
    for (i = 0; i < 7; i++) {
      dt = new Date(sun); dt.setDate(sun.getDate() + i); var k = ymd(dt), v = 0;
      sess.forEach(function (s) { if (s.date === k) v += s.volume; });
      series.push(v); labels.push(WD[i]);
    }
  } else {
    var weeks = per === 'month' ? 5 : 12;
    for (i = weeks - 1; i >= 0; i--) {
      var a = ymd(new Date(Date.now() - (i + 1) * 7 * 864e5)), z = ymd(new Date(Date.now() - i * 7 * 864e5)), c = 0;
      (b.sessions || []).forEach(function (s) { if (s.date > a && s.date <= z) c++; });
      var sd = new Date(Date.now() - ((i + 1) * 7 - 1) * 864e5);
      series.push(c); labels.push(weeks <= 6 || i % 3 === 0 ? sd.getDate() + ' ' + MON[sd.getMonth()] : '');
    }
  }
  var prList = Object.keys(b.prs || {}).map(function (k) { var o = clone(b.prs[k]); o.id = k; return o; })
    .filter(function (x) { return x.w > 0; }).sort(function (a, c) { return a.wDate < c.wDate ? 1 : -1; }).slice(0, 10);
  return topbar('تقدّمي', { noBack: true, right: '<button class="btn sm dark" data-act="go" data-to="history">' + ic('history') + ' سجل التمارين</button>' }) +
    '<div class="seg">' + [['week', 'الأسبوع'], ['month', 'الشهر'], ['year', 'السنة']].map(function (x) { return '<button class="' + (per === x[0] ? 'on' : '') + '" data-act="tab" data-k="period" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div class="stats3"><div class="stat"><i class="ti ti-calendar-check" style="color:#00E0B8"></i><div class="sv en">' + sess.length + '</div><div class="sl">جلسة</div></div>' +
    '<div class="stat"><i class="ti ti-list-numbers" style="color:#00C2FF"></i><div class="sv en">' + fmtN(sets) + '</div><div class="sl">مجموعة</div></div>' +
    '<div class="stat"><i class="ti ti-stack-2" style="color:#7B3CFF"></i><div class="sv en">' + (vol >= 1e6 ? (Math.round(vol / 1e4) / 100) + '<small>M</small>' : fmtN(vol)) + '</div><div class="sl">حجم التمرين (كجم)</div></div></div>' +
    '<div class="xs mut center">حجم التمرين = مجموع (الوزن × العدّات) لكل المجموعات، بدون الإحماء</div>' +
    '<div class="card"><div class="row between"><h3 style="margin:0">' + (per === 'week' ? 'حجم التمرين باليوم' : 'عدد الجلسات بالأسبوع') + '</h3>' +
    (per !== 'week' && trainDays() ? '<span class="xs b" style="color:#00E0B8">- - هدفك: ' + trainDays() + ' أيام</span>' : '') + '</div><div dir="ltr">' + bars(series, labels, per === 'week' ? 0 : trainDays(), { values: true, fmt: per === 'week' ? kfmt : null }) + '</div></div>' +
    '<div class="sec-h"><h3>أرقامك القياسية</h3></div><div class="col">' +
    (prList.length ? prList.map(function (x) {
      var e = exOf(x.id);
      return '<button class="list-item" data-act="openEx" data-id="' + esc(x.id) + '" data-tabv="hist">' + thumb(e) + '<div class="grow"><div class="en b ell">' + esc(e.name) + '</div><div class="xs mut en">' + x.wDate + '</div></div><div class="pr en">' + x.w + ' kg</div></button>';
    }).join('') : '<div class="card center mut">سجّل أول تمرين، وأرقامك القياسية بتطلع هنا.</div>') + '</div>' + nav('progress');
};

  quickWeightSave: function () {
    call('addBody', { date: ymd(), weight: val('qw') }).then(function (r) { S.boot.body = r.body; setBoot(S.boot); closeSheet(); render(); toast('تم حفظ وزنك'); }).catch(function (e) { toast(e.message); });
  },
  addFood: function () {
    call('addNutrition', { date: ymd(), calories: val('ncal'), protein: val('npro'), note: val('nnote') }).then(function (r) {
      S.boot.nutrition = r.nutrition; setBoot(S.boot); render(); toast('تمت الإضافة');
    }).catch(function (e) { toast(e.message); });
  },
  delFood: function (el) {
    call('delNutrition', { id: el.dataset.id }).then(function (r) { S.boot.nutrition = r.nutrition; setBoot(S.boot); render(); }).catch(function (e) { toast(e.message); });
  },
  saveBody: function () {
    call('addBody', { date: val('bdate'), weight: val('bw'), muscle: val('bm'), fat: val('bf') }).then(function (r) {
      S.boot.body = r.body; setBoot(S.boot); render(); toast('تم حفظ القياس');
    }).catch(function (e) { toast(e.message); });
  },
  saveTargets: function () {
    var st = S.boot.settings;
    call('saveTargets', { calTarget: val('tcal'), proteinTarget: val('tpro'), weeklyTarget: st.weeklyTarget || 4, restSec: val('trest') }).then(function (r) {
      S.boot.settings = r.settings; setBoot(S.boot); toast('تم حفظ الأهداف'); back();
    }).catch(function (e) { toast(e.message); });
  },
  calcTargets: function () {
    var u = S.boot.user, w = latestWeight();
    if (!w) return toast('سجّل وزنك أول');
    var t = calcT(u, w, +val('tact'));
    $('tcal').value = t.cal; $('tpro').value = t.prot;
    toast('هدفك التقديري: ' + fmtN(t.cal) + ' سعرة و ' + t.prot + ' جم بروتين. اضغط حفظ لاعتماده');
  },

  /* الحساب */
  saveProfile: function () {
    call('saveProfile', { name: val('aname'), username: val('auser'), email: val('aemail'), height: val('aheight'), age: val('aage'), goal: val('agoal') }).then(function (r) {
      S.boot.user = r.user; setBoot(S.boot); toast('تم حفظ بياناتك');
    }).catch(function (e) { toast(e.message); });
  },
  saveRest: function () {
    var st = S.boot.settings;
    call('saveTargets', { calTarget: st.calTarget, proteinTarget: st.proteinTarget, weeklyTarget: st.weeklyTarget || 4, restSec: val('arest') }).then(function (r) {
      S.boot.settings = r.settings; setBoot(S.boot); toast('تم حفظ وقت الراحة');
    }).catch(function (e) { toast(e.message); });
  },
  changePw: function () {
    call('changePassword', { old: $('apw0').value, new: $('apw1').value }).then(function () {
      $('apw0').value = ''; $('apw1').value = ''; toast('تم تغيير كلمة المرور');
    }).catch(function (e) { toast(e.message); });
  },
  delAsk: function () {
    openSheet('<h2>طلب حذف الحساب</h2><p class="mut">بينحذف حسابك وكل بياناتك نهائيًا خلال 7 أيام، وما تقدر ترجعها.</p>' +
      '<div><label class="f" for="delpw">اكتب كلمة المرور للتأكيد</label><input id="delpw" type="password" dir="ltr" autocomplete="current-password"></div>' +
      '<button class="btn dark text-danger" data-act="delYes">تأكيد طلب الحذف</button><button class="btn dark" data-act="closeSheet">إلغاء</button>');
  },
  delYes: function () {
    call('requestDelete', { password: $('delpw').value }).then(function () {
      closeSheet(); ACT.logout(); toast('وصلنا طلبك، بيتم حذف حسابك خلال 7 أيام');
    }).catch(function (e) { toast(e.message); });
  },
  sendFeedback: function () {
    var t = val('fbtext');
    if (t.length < 3) return toast('اكتب ملاحظتك');
    call('feedback', { text: t, screen: (S.stack[S.stack.length - 1] || [''])[0] }).then(function () {
      toast('وصلت ملاحظتك، شكرًا 🙏'); back();
    }).catch(function (e) { toast(e.message); });
  },

  /* التثبيت والتنبيهات */
  install: function () { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); },
  instHide: function () { LS.set('instHide', Date.now() + 7 * 864e5); render(); },
  pushHide: function () { LS.set('pushHide', Date.now() + 7 * 864e5); render(); },
  enablePush: function () { enablePush(); },
  pushTest: function () {
    pushLater('rest', 5, 'هذا تنبيه تجريبي ✅').then(function (id) { toast(id ? 'اقفل الشاشة، بيجيك تنبيه بعد ثواني' : 'ما انرسل التنبيه، تأكد إن «خلصت الراحة» مفعّل'); });
  },
  prefT: function (el) { var k = el.dataset.k, o = {}; o[k] = (S.boot.notif || {})[k] ? 0 : 1; savePrefs(o); render(); },
  /* الأصدقاء */
  friendAdd: function () {
    var u = val('frU'); if (!u) return toast('اكتب اسم المستخدم');
    call('friendAdd', { username: u }).then(function (r) { S.friends = r; render(); toast('تم ✅'); }).catch(function (e) { toast(e.message); });
  },
  friendYes: function (el) { call('friendRespond', { id: el.dataset.id, accept: true }).then(function (r) { S.friends = r; render(); toast('صرتوا أصدقاء 🤝'); }).catch(function (e) { toast(e.message); }); },
  friendNo: function (el) { call('friendRespond', { id: el.dataset.id, accept: false }).then(function (r) { S.friends = r; render(); }).catch(function (e) { toast(e.message); }); },
  friendDelAsk: function (el) { confirmSheet('حذف ' + esc(el.dataset.name) + '؟', 'ما راح يوصله إشعار، بس تختفون من قائمة بعض.', 'حذف', 'friendDelYes', 'data-id="' + el.dataset.id + '"', true); },
  friendDelYes: function (el) { closeSheet(); call('friendRemove', { id: el.dataset.id }).then(function (r) { S.friends = r; render(); }).catch(function (e) { toast(e.message); }); },

  /* الأدمن */
  castAsk: function () {
    if (val('bcX').length < 3) return toast('اكتب الرسالة');
    S.cast = { title: val('bcT'), text: val('bcX') };
    confirmSheet('إرسال للكل؟', 'بيوصل تنبيه لكل المستخدمين اللي مفعّلين التنبيهات.', 'إرسال', 'castYes');
  },
  castYes: function () {
    closeSheet();
    call('adminBroadcast', S.cast || {}).then(function (r) { toast('انرسلت لـ ' + r.sent + ' مستخدم 📣'); var t = $('bcX'); if (t) t.value = ''; }).catch(function (e) { toast(e.message); });
  },
  adminReload: function () { S.admin = null; render(); },
  adminF: function (el) { S.adminF = el.dataset.v; render(); },
  adminApprove: function (el) { call('adminApprove', { id: el.dataset.id }).then(function (r) { S.admin = r; render(); toast('تم تفعيل الحساب ✅'); }).catch(function (e) { toast(e.message); }); },
  adminSuspend: function (el) { confirmSheet('إيقاف الحساب؟', 'المستخدم ما بيقدر يدخل لين تفعّله من جديد. بياناته تبقى محفوظة.', 'إيقاف', 'adminSuspendYes', 'data-id="' + el.dataset.id + '"', true); },
  adminSuspendYes: function (el) { closeSheet(); call('adminSuspend', { id: el.dataset.id }).then(function (r) { S.admin = r; render(); toast('تم الإيقاف'); }).catch(function (e) { toast(e.message); }); },
  adminActivate: function (el) { call('adminActivate', { id: el.dataset.id }).then(function (r) { S.admin = r; render(); toast('تم التفعيل'); }).catch(function (e) { toast(e.message); }); },
  adminReset: function (el) { confirmSheet('كلمة مرور مؤقتة؟', 'بنولّد كلمة مرور جديدة، وكلمة المرور القديمة بتتوقف.', 'توليد', 'adminResetYes', 'data-id="' + el.dataset.id + '"'); },
  adminResetYes: function (el) {
    call('adminResetPassword', { id: el.dataset.id }).then(function (r) {
      S.admin = { users: r.users, today: S.admin && S.admin.today }; render();
      openSheet('<h2>كلمة المرور المؤقتة</h2><p class="mut">أرسلها لـ ' + esc(r.name) + '، وخلّه يغيّرها من «الحساب والأمان».</p><div class="card center"><div class="big2 en">' + esc(r.temp) + '</div></div><button class="btn" data-act="closeSheet">تمام</button>');
    }).catch(function (e) { toast(e.message); });
  },
  adminDelAsk: function (el) {
    confirmSheet('حذف حساب ' + esc(el.dataset.name) + '؟', 'بتنمسح بياناته الشخصية، وملف تمارينه ينتقل لسلة المهملات في Drive. ما تقدر تتراجع.', 'حذف نهائي', 'adminDeleteYes', 'data-id="' + el.dataset.id + '"', true);
  },
  adminDeleteYes: function (el) {
    closeSheet();
    call('adminDelete', { id: el.dataset.id }).then(function (r) { S.admin = r; render(); toast('تم حذف الحساب'); }).catch(function (e) { toast(e.message); });
  }
};

function doSwap(ctx, i, id) {
  var r = itemRef(ctx, i), e = S.ex[id];
  if (!r || !e) return render();
  if (ctx === 'prog') {
    r.it.ex = id; render(); saveProg('تم التبديل إلى ' + e.name); return;
  }
  var d = S.draft, it = r.it;
  if (!it.rows.some(function (x) { return x.done; })) {
    var n = it.rows.length;
    it.exId = id; it.name = e.name; it.rows = makeRows(id, n);
  } else {
    var left = it.rows.filter(function (x) { return !x.done; }).length || 1;
    it.rows = it.rows.filter(function (x) { return x.done; }); it.target.sets = it.rows.length;
    d.items.splice(i + 1, 0, sessItem(id, { sets: left, min: it.target.min, max: it.target.max }));
    d.cur = i + 1;
  }
  d.restEnd = null; saveDraft(); S.params = {}; render(); window.scrollTo(0, 0);
  toast('تم التبديل إلى ' + e.name);
}

function beginDay(day) {
  S.draft = {
    id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), dayId: day.id, dayName: day.name,
    date: ymd(), startedAt: Date.now(), cur: 0, restEnd: null, restTotal: +S.boot.settings.restSec || 90,
    orig: day.items.map(function (it) { return { ex: it.ex, sets: +it.sets, min: +it.min, max: +it.max }; }),
    items: day.items.map(function (it) { return sessItem(it.ex, it); })
  };
  saveDraft();
  schedForgot();
  go('session', { view: 'list' });
}

function filterLib(q) {
  S.libQ = q;
  var t = String(q || '').trim().toLowerCase(), n = 0;
  document.querySelectorAll('#libList [data-s]').forEach(function (el) {
    var ok = !t || el.dataset.s.indexOf(t) >= 0;
    el.style.display = ok ? '' : 'none';
    if (ok) n++;
  });
  var c = $('libCount'); if (c) c.textContent = n + ' تمرين';
}

/* ===================== الأحداث ===================== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el && el.dataset && el.dataset.pref) { var o = {}; o[el.dataset.pref] = +el.value; savePrefs(o, 'تم الحفظ'); }
});
document.addEventListener('input', function (e) {
  var el = e.target, k = el.dataset ? el.dataset.bind : null;
  if (el.dataset && el.dataset.filter) return filterLib(el.value);
  if (!k) return;
  if (k === 'rowW' || k === 'rowR') {
    var it = S.draft && S.draft.items[S.draft.cur], r = it && it.rows[+el.dataset.row];
    if (r) { r[k === 'rowW' ? 'w' : 'r'] = el.value; saveDraft(); }
    return;
  }
  if (k === 'seW' || k === 'seR') { var se = S.sEdit && S.sEdit.sets[+el.dataset.i]; if (se) se[k === 'seW' ? 'w' : 'r'] = el.value; }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var id = e.target && e.target.id;
  if (id === 'lpw' || id === 'lphone') ACT.login();
});

/* عدّاد الوقت والراحة والتايمر */
setInterval(function () {
  document.querySelectorAll('[data-elapsed]').forEach(function (el) { el.textContent = fmtDur(Date.now() - (+el.dataset.elapsed)); });
  if (S.sw && S.route === 'session') { var inp = $('rowR' + S.sw.row); if (inp) inp.value = Math.round((Date.now() - S.sw.start) / 1000); }
  var d = S.draft;
  if (S.route !== 'session' || !d || !d.restEnd) return;
  var rem = d.restEnd - Date.now();
  if (rem <= 0) {
    d.restEnd = null; saveDraft();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (err) {}
    toast('خلصت الراحة، يلا المجموعة الجاية 💪');
    if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render();
    return;
  }
  var t = $('restTxt'); if (t) t.textContent = fmtSec(Math.ceil(rem / 1000));
  var f = $('restFill'); if (f) f.style.width = (rem / (d.restTotal * 1000) * 100).toFixed(1) + '%';
}, 1000);

/* ===================== التشغيل ===================== */
function start() {
  render();
  if (!S.token) { setTimeout(function () { go('welcome', {}, { root: true }); }, 900); return; }
  if (S.boot) go(S.draft ? 'session' : 'home', S.draft ? { view: 'list' } : {}, { root: true });
  var q = S.queue.length ? flushQueue() : Promise.resolve();
  q.catch(function () {}).then(function () { return call('bootstrap'); }).then(function (b) {
    setBoot(b);
    if (pushState() === 'on') pushLogin();
    var hr = String(location.hash || '').slice(1);
    if (['friends', 'progress', 'admin', 'me', 'notify'].indexOf(hr) >= 0 && !S.draft) {
      try { history.replaceState(null, '', location.pathname); } catch (x) {}
      if (hr === 'admin' && b.user.role !== 'admin') hr = 'home';
      go(hr, {}, { root: ['progress'].indexOf(hr) >= 0 });
    } else if (S.route === 'splash') go(S.draft ? 'session' : 'home', S.draft ? { view: 'list' } : {}, { root: true });
    else if (['home', 'program', 'progress', 'more'].indexOf(S.route) >= 0) render();
  }).catch(function (e) {
    if (!S.token) return;
    if (!S.boot) { go('login', {}, { root: true }); toast(e.message); }
    else toast('تعرض آخر بيانات محفوظة. ' + e.message);
  });
}
start();
})();
</script>
