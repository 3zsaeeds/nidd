<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="description" content="سجّل تمارينك وتابع تقدّمك في الجيم">
  <meta name="apple-mobile-web-app-title" content="نِدّ">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <script>
  (function () {
    if (window.NIDD_OS) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      var s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true; document.head.appendChild(s);
      OneSignalDeferred.push(function (O) {
        return O.init({ appId: window.NIDD_OS, serviceWorkerPath: 'sw.js', serviceWorkerParam: { scope: '/' }, notifyButton: { enable: false } }).then(function () {
          O.Notifications.addEventListener('foregroundWillDisplay', function (e) {
            var d = (e.notification && e.notification.additionalData) || {};
            if (d.type === 'rest' && document.visibilityState === 'visible') e.preventDefault();
          });

      });
    } else if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  })();

  <meta name="theme-color" content="#0B0F1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
:root{
  --bg:#0B0F1A;--c1:#141827;--c2:#1F2438;--c3:#2E3552;--mut:#8A93A6;--tx:#E6ECF2;
  --pink:#FF3B8D;--pur:#7B3CFF;--cyan:#00C2FF;--org:#FF8A00;--teal:#00E0B8;--yel:#FFD34D;
  --grad:linear-gradient(270deg,#FF8A00 0%,#FF3B8D 35%,#7B3CFF 68%,#00C2FF 100%);
  --grad2:linear-gradient(135deg,#FF3B8D,#7B3CFF);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(520px 260px at 100% -40px,rgba(123,60,255,.20),transparent 70%),
  radial-gradient(420px 260px at -10% 0,rgba(255,59,141,.12),transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(100px + env(safe-area-inset-bottom))}
#app>*+*{margin-top:14px}
button{font-family:inherit;cursor:pointer}
.en{direction:ltr;unicode-bidi:isolate}
h1{font-size:26px;font-weight:800;margin:0;line-height:1.25}
h2{font-size:19px;font-weight:700;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}.b{font-weight:700}
.center{text-align:center}.w100{width:100%}
.text-danger{color:#FF5C8A!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.card{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:14px}
.card.warn{border-color:rgba(255,138,0,.35)}
.card h3{margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card.mini{padding:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:20px!important}
.pg-h{margin-top:6px}

/* أزرار */
.btn{appearance:none;border:0;border-radius:16px;height:54px;padding:0 18px;font-weight:700;font-size:17px;color:#fff;background:var(--grad);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn i{font-size:20px}
.btn.ghost{background:rgba(0,194,255,.05);border:1.5px solid #1E5A9E;color:#8FD3FF}
.btn.dark{background:var(--c2);color:var(--tx)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.text-danger{background:transparent}
.btn:disabled{opacity:.55}
.btn:active,.list-item:active,.stat:active,.hero-card:active{transform:scale(.985)}
.link{background:none;border:0;color:#8FD3FF;font-size:15px;padding:6px;width:100%}
.link.sm{width:auto;font-size:13px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:13px;background:var(--c1);border:1px solid var(--c2);color:var(--tx);display:grid;place-items:center;font-size:20px;padding:0}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;font-size:17px}
.icon-btn.danger{color:#FF5C8A}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* حقول */
input,select{width:100%;height:50px;border-radius:14px;border:1px solid var(--c3);background:var(--c1);color:var(--tx);padding:0 14px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 22px,24px 22px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(123,60,255,.25)}
input::placeholder{color:#5D6680}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 4px 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut)}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pur);-webkit-appearance:auto;appearance:auto}
.search{position:relative}.search i{position:absolute;right:14px;top:15px;color:var(--mut);font-size:20px}.search input{padding-right:42px}

/* تبويبات وشرائح */
.seg{display:flex;background:var(--c1);border:1px solid var(--c2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:14px;height:38px;border-radius:10px;white-space:nowrap;padding:0 12px}
.seg button.on{background:linear-gradient(135deg,#00C2FF,#2F6BFF);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--c2);color:var(--tx);font-size:13px;font-weight:700;border:0;white-space:nowrap;flex:none}
.chip.on{background:var(--grad2)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500}

/* شريط التنقل */
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;display:flex;background:rgba(20,24,39,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--c2);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button i{font-size:25px}
.nav button.on{color:var(--org)}
.nav button.on i{color:var(--yel)}

/* أعلى الشاشة */
.topbar{display:flex;align-items:center;gap:10px;min-height:44px}
.topbar h2{text-align:right}
.home-h h1{font-size:28px}

/* البطاقات الرئيسية */
.hero-card{position:relative;overflow:hidden;border-radius:22px;padding:18px;min-height:118px;background:linear-gradient(120deg,#FF3B8D 0%,#9B3CF0 55%,#7B3CFF 100%);display:block;width:100%;text-align:right;border:0;color:#fff}
.hero-card.alt{background:linear-gradient(120deg,#1F2438,#2E3552)}
.hero-card.resume{background:linear-gradient(120deg,#FF8A00,#FF3B8D)}
.hc-title{font-size:26px;font-weight:800;line-height:1.2;position:relative;z-index:1}
.hc-meta{font-size:13px;opacity:.92;margin-top:4px;position:relative;z-index:1}
.hc-go{position:absolute;left:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);color:#7B3CFF;display:grid;place-items:center;font-size:22px;z-index:1}
.hc-deco{position:absolute;left:-6px;top:-18px;font-size:128px;opacity:.16}
.hero-card .chip{margin-top:12px;background:rgba(255,255,255,.18);color:#fff}

.note{display:flex;align-items:center;gap:8px;background:rgba(255,211,77,.08);border:1px solid rgba(255,211,77,.25);color:#FFE38A;border-radius:14px;padding:10px 12px;font-size:14px}
.note .chip{margin-right:auto;height:30px}

.bar{height:8px;border-radius:99px;background:var(--c2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(270deg,#FF8A00,#FF3B8D,#7B3CFF);border-radius:99px}

.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:12px 8px;text-align:center;color:var(--tx);width:100%}
.stat i{font-size:28px}
.sv{font-size:22px;font-weight:800;margin-top:4px;line-height:1.2}
.sv small{font-size:12px;font-weight:500;margin-right:2px}
.sl{font-size:12px;color:var(--mut)}
.big2{font-size:30px;font-weight:800;line-height:1.2}
.big3{font-size:24px;font-weight:800}
.big3 small{font-size:13px;font-weight:500}
.delta{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:2px}

/* القوائم */
.list-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--c1);border:1px solid var(--c2);border-radius:16px;width:100%;color:var(--tx);text-align:right}
.list-item.done{border-color:rgba(0,224,184,.4)}
.thumb{width:48px;height:48px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:24px}
.pr{font-weight:800;color:var(--yel)}
.tpl{display:block;width:100%;text-align:right;background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:14px;color:var(--tx)}
.tpl>*+*{margin-top:8px}

/* تعديل البرنامج */
.edit-nums{margin-top:10px;align-items:flex-end}
.edit-nums input{height:42px;text-align:center}
.mini-step{display:flex;align-items:center;gap:6px;text-align:center}
.mini-step button{width:34px;height:42px;border-radius:10px;border:0;background:var(--c2);color:var(--tx);font-size:16px}
.mini-step b{font-size:20px}

/* صفحة التمرين */
.ex-hero{position:relative;border-radius:22px;padding:14px;min-height:178px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(90% 100% at 15% 15%,var(--c),transparent 65%),linear-gradient(135deg,#2E3552,#141827)}
.ex-hero>*{position:relative;z-index:1}
.ex-hero h1{font-size:28px;margin-bottom:8px}
.ex-hero .tag{background:rgba(0,0,0,.28)}
.ex-deco{position:absolute!important;left:-10px;top:-6px;font-size:150px;opacity:.14;z-index:0!important}
.mmap{display:flex;justify-content:center;gap:18px;margin-top:4px}
.mmap figure{margin:0;text-align:center}
.mmap svg{width:118px;height:auto}
.mmap figcaption{font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* جلسة التمرين */
.ring{position:relative;margin:0 auto}
.ring svg{width:100%;height:100%;display:block}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:60px;font-weight:800;line-height:1}
.last{text-align:center;background:var(--c1);border:1px dashed var(--c3);border-radius:14px;padding:8px 10px}
.sug{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--teal);font-weight:700}
.steppers{display:grid;grid-template-columns:1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--c2);border-radius:18px;padding:8px}
.stepper button{width:54px;height:54px;flex:none;border-radius:14px;border:0;background:var(--c2);color:var(--tx);font-size:22px}
.num{height:42px!important;border:0!important;background:transparent!important;text-align:center;font-size:30px!important;font-weight:800;padding:0!important;box-shadow:none!important}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--c2)}
.set-row:last-child{border-bottom:0}
.set-row .mut{width:76px;font-size:13px}

/* الجدول */
.week{display:flex;gap:6px}
.wd{flex:1;text-align:center;padding:8px 0;border-radius:14px;background:var(--c1);border:1px solid var(--c2);display:flex;flex-direction:column;gap:2px;font-size:11px}
.wd b{font-size:16px}
.wd.on{background:var(--grad2);border-color:transparent}
.wd .dot{width:5px;height:5px;border-radius:50%;background:var(--org);margin:0 auto}
.sched{display:flex;align-items:center;gap:12px;width:100%;background:var(--c1);border:1px solid var(--c2);border-radius:18px;padding:10px;color:var(--tx);text-align:right}
.sched.today{border-color:var(--pur)}
.sched-d{width:62px;flex:none;font-size:14px}
.sched-c{flex:1;border-radius:14px;padding:10px 12px;background:linear-gradient(120deg,#FF3B8D,#7B3CFF);color:#fff}
.sched-c.rest{background:var(--c2);color:var(--tx)}

/* المزيد */
.profile{display:flex;align-items:center;gap:12px;width:100%;background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);padding:12px;color:var(--tx);text-align:right}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--grad2);display:grid;place-items:center;font-weight:800;font-size:18px}
.menu{background:var(--c1);border:1px solid var(--c2);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--c2);color:var(--tx);font-size:15px;text-align:right}
.menu button:last-child{border-bottom:0}
.mi{font-size:22px;color:#9B7BFF}

/* شاشات الدخول */
.hero-wall{position:relative;min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden;padding:28px 20px;background:#0B0F1A;display:flex;flex-direction:column}
.hero-wall::before{content:"";position:absolute;inset:-25%;z-index:0;background:
  radial-gradient(38% 30% at 18% 28%,rgba(255,59,141,.55),transparent 70%),
  radial-gradient(40% 32% at 88% 42%,rgba(123,60,255,.6),transparent 70%),
  radial-gradient(42% 30% at 28% 86%,rgba(255,138,0,.45),transparent 70%),
  radial-gradient(34% 28% at 82% 92%,rgba(0,194,255,.35),transparent 70%);filter:blur(8px)}
.hero-wall>*{position:relative;z-index:1}
.wordmark{display:flex;align-items:center;gap:14px;font-size:42px;font-weight:800;line-height:1}
.wordmark i{width:2px;height:36px;background:linear-gradient(#FF3B8D,#00C2FF);border-radius:2px}
.slogan{letter-spacing:.35em;font-size:14px;color:#C9D1E0}
.auth-logo{display:flex;justify-content:center;margin:8px 0 4px}

/* الرسوم */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.empty-chart{padding:22px 0;text-align:center}

/* النوافذ والتنبيهات */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,14,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--c1);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:1px solid var(--c3);animation:up .22s ease}
.sheet>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trophy{font-size:64px;text-align:center;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--c2);border:1px solid var(--c3);padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:90%;text-align:center;animation:fade .2s ease}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:right;z-index:70;transition:transform .25s}
#busy.on{transform:scaleX(.85);transition:transform 6s cubic-bezier(.1,.6,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* الاشتراك والتعديل */
a.btn{text-decoration:none}
.btn.wa{background:linear-gradient(135deg,#25D366,#00A884);color:#fff}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plan{background:var(--c1);border:1px solid var(--c3);border-radius:var(--r);padding:12px;text-align:center}
.plan-p{font-size:22px;font-weight:800;color:var(--yel);margin-top:2px}
.plan-p small{font-size:12px;font-weight:500;color:var(--mut)}
.plan-edit{display:flex;gap:8px;align-items:flex-end}
.plan-edit input{height:42px}
.set-edit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c2)}
.set-edit:last-child{border-bottom:0}
.set-edit .chip{width:86px;justify-content:center;flex:none}
.set-edit input{height:42px;text-align:center;padding:0 6px;min-width:0;flex:1}
.stat.sel{border-color:var(--pur);box-shadow:0 0 0 2px rgba(123,60,255,.3) inset}

/* ===== v1.1: أزرار فوق، جلسة بالجدول، المصمّم ===== */
.actions{display:flex;gap:10px;align-items:center}
.actions .btn{flex:1}
.icon-btn.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.btn.light{background:#fff;color:#7B3CFF;margin-top:14px;position:relative;z-index:1}
.btn.dashed{background:transparent;border:1.5px dashed var(--c3);color:var(--mut);height:50px}
.btn.glow{box-shadow:0 0 0 3px rgba(0,224,184,.35),0 8px 24px rgba(123,60,255,.35);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(0,224,184,.15),0 8px 24px rgba(123,60,255,.35)}}
.plain{background:none;border:0;color:inherit;text-align:right;padding:0;font:inherit;min-width:0}
.list-item.slim{padding:8px}
.list-item.slim .thumb{width:38px;height:38px;font-size:19px;border-radius:11px}
.list-item .chip{flex:none}
.seg button[data-act="addDay"]{flex:none;width:42px;padding:0}
textarea{width:100%;border-radius:14px;border:1px solid var(--c3);background:var(--c1);color:var(--tx);padding:12px 14px;font:inherit;font-size:16px;outline:none;resize:vertical}
textarea:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(123,60,255,.25)}
.card.hl{border-color:rgba(123,60,255,.55);background:linear-gradient(135deg,rgba(123,60,255,.12),rgba(255,59,141,.06)),var(--c1)}
.card.hl .row{margin-top:10px}
.card.hl .btn{flex:1}
.restbar{background:linear-gradient(120deg,rgba(0,194,255,.14),rgba(123,60,255,.14));border:1px solid rgba(0,194,255,.35);border-radius:16px;padding:10px 12px;position:sticky;top:8px;z-index:15;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.restbar .row{gap:6px}
.restbar .big3{text-align:center}
.restbar .chip{height:30px;padding:0 10px}
.restbar .bar{margin-top:8px}

  <script>
/**
 * نِدّ: وحدة الحسابات (الموجة الأولى، الخطوة ١)
 * دوال صافية بدون واجهة: الوزن المقترح، السعرات والماكروز المقترحة، السعرات المحروقة،
 * الجهد من 0 إلى 21، ونموذج الرئيسية. نخزّن المدخلات فقط، وكل رقم ينحسب هنا.
 * المرجع: مستند «قرارات مجلس المستشارين» البند ١٢ والبند ٢.
 */
var Calc = (function () {
  'use strict';
  var LEGS = { quads: 1, hamstrings: 1, glutes: 1, calves: 1 };
  var BIG_LEGS = { quads: 1, hamstrings: 1, glutes: 1 };
  var UPPER = { chest: 1, back: 1, shoulders: 1, biceps: 1, triceps: 1, forearms: 1 };

  function rnd(v, step) { return Math.round(v / step) * step; }
  function r1(v) { return Math.round(v * 10) / 10; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diff(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function weekStart(s) { return addDays(s, -parse(s).getDay()); }

  /* ===================== الوزن المقترح ===================== */
  /** مقدار الزيادة: +2.5 أجهزة وعلوي، +5 أرجل كبيرة، +1 إلى 2 دمبل. it.inc يغلب */
  function inc(e, it, lastW) {
    if (it && +it.inc > 0) return +it.inc;
    e = e || {};
    if (e.equip === 'dumbbell') return lastW >= 10 ? 2 : 1;
    if (e.type === 'compound' && BIG_LEGS[e.muscle]) return 5;
    return 2.5;
  }

  function work(l) { return l ? (l.sets || []).filter(function (x) { return !x.wu; }) : []; }
  function top(ws) { return ws.reduce(function (m, x) { return Math.max(m, +x.w || 0); }, 0); }

  /**
   * الوزن المقترح للمرة الجاية.
   * last/prev: {date, sets:[{w,r,wu}]} آخر جلستين للتمرين. o.beginner: أول أسبوعين للمبتدئ.
   * يرجع {mode: up|same|down|repeat|none, w, last}
   */
  function suggest(e, it, last, prev, o) {
    o = o || {}; e = e || {}; it = it || {};
    var ws = work(last);
    if (!ws.length || e.type === 'time' || e.equip === 'bodyweight') return { mode: 'none', w: 0, last: 0 };
    var t = top(ws);
    if (!(t > 0)) return { mode: 'none', w: 0, last: 0 };
    if (o.beginner) return { mode: 'repeat', w: t, last: t };
    var min = +it.min || 0, max = +it.max || 0, sets = +it.sets || ws.length;
    // زيادة: كمّل الحد الأعلى في كل المجموعات
    if (max && ws.length >= sets && ws.every(function (x) { return +x.r >= max; })) {
      var st = inc(e, it, t);
      return { mode: 'up', w: Math.round((t + st) * 100) / 100, last: t, step: st };
    }
    // تنزيل: العدّات تحت الحد الأدنى في جلستين ورا بعض على نفس الوزن
    var pw = work(prev);
    if (min && pw.length && top(pw) === t) {
      var low = function (arr, w) { return arr.some(function (x) { return +x.w === w && +x.r < min; }); };
      if (low(ws, t) && low(pw, t)) {
        var s2 = inc(e, it, t), nw = rnd(t * 0.925, s2);
        if (nw >= t) nw = t - s2;
        return { mode: 'down', w: Math.max(0, Math.round(nw * 100) / 100), last: t };
      }
    }
    return { mode: 'same', w: t, last: t };
  }

  /* ===================== السعرات والماكروز المقترحة ===================== */
  var FACT = [1.2, 1.375, 1.55, 1.725, 1.9];
  function factor(days, active) {
    days = +days || 0;
    var i = days <= 0 ? 0 : days <= 2 ? 1 : days <= 5 ? 2 : 3;
    if (active) i = Math.min(4, i + 1);
    return FACT[i];
  }
  function bmr(p) { return 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : 5); }
  var PROT = { cut: [2.0, 2.2], recomp: [2.0, 2.2], lose: [1.8, 2.0], bulk: [1.6, 2.0], fit: [1.4, 1.6] };

  /**
   * p: {sex, age, height, weight, days, active, goal: lose|cut|bulk|fit, level, style: balanced|high|lowcarb|keto, targetWeight}
   * يرجع السعرات المقترحة والتقسيم بالجرامات والسعرات + التنبيهات

    var goal = p.goal || 'fit';

    var style = p.style || 'balanced';

      fetch(window.NIDD_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: S.token, payload: payload }), signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.json(); }).then(function (r) { clearTimeout(timer); ok(r); }).catch(function () { clearTimeout(timer); fail(); });
    } else {
      google.script.run.withSuccessHandler(function (r) { clearTimeout(timer); ok(r); }).withFailureHandler(function () { clearTimeout(timer); fail(); }).api(action, S.token, payload);
    }

}

/* ===================== صندوق الصادر (الحفظ بدون إنترنت) ===================== */
/**
 * كل تعديل ينحفظ هنا أول، ويبان فورًا، ثم ينرسل بالترتيب.
 * key: لو تكرر نفس الشي (وزن نفس اليوم، البرنامج، الجدول) يبقى الأحدث بس.
 * كل الإجراءات آمنة لو انرسلت مرتين: الجلسة برقم ثابت، والباقي يكتب فوق نفسه.
 */

  S.queue.push({ k: k, id: p.id || ('q' + Date.now().toString(36)), p: p, key: key || '', uid: S.raw && S.raw.user ? S.raw.user.id : '', at: Date.now() });
  LS.set('queue', S.queue);

  flushQueue().catch(function () {});
}
/** قبل استبدال البرنامج كامل: التعديلات القديمة اللي ما انرسلت ما عاد لها داعي */

    var q = S.queue.filter(function (x) { return !x.uid || !me || x.uid === me; })[0];
    if (!q) return Promise.resolve({ prs: prs });
    var payload = q.k === 'session' ? { session: q.p } : clone(q.p);
    return call(QK[q.k], payload, { quiet: true }).then(function (r) {
      S.queue = S.queue.filter(function (x) { return x !== q; }); LS.set('queue', S.queue);
      if (q.k === 'session') { prs = prs.concat(r.prs || []); if (r.boot) setBoot(r.boot); else refreshView(); }
      else if (q.k === 'program') setBoot(r);
      else if (q.k === 'body') { S.raw.body = r.body; LS.set('raw', S.raw); refreshView(); }
      else if (q.k === 'schedule' || q.k === 'settings') { S.raw.settings = r.settings; LS.set('raw', S.raw); refreshView(); }
      return next();
    }, function (e) {
      if (e.net || ['AUTH', 'EXPIRED', 'SUSPENDED', 'PENDING'].indexOf(e.code) >= 0) throw e; // تبقى بالصندوق
      // السيرفر رفضها (بيانات غير صحيحة): نشيلها ونحتفظ بنسخة
      S.queue = S.queue.filter(function (x) { return x !== q; }); LS.set('queue', S.queue);

function weekCount() {
  var n = new Date(), sun = new Date(n.getFullYear(), n.getMonth(), n.getDate() - n.getDay()), from = ymd(sun);
  return (S.boot.sessions || []).filter(function (s) { return s.date >= from && s.dayId !== 'act'; }).length;
}
function trainDays() { var s = S.boot.settings.schedule || {}, n = 0; for (var k in s) if (s[k]) n++; return n; }
function todayPlan() {
  var b = S.boot, p = b.program || [];
  if (!p.length) return { none: true };
  var sch = b.settings.schedule || {}, has = Object.keys(sch).some(function (k) { return sch[k]; });
  var day = null, rest = false;
  if (has) {
    var id = sch[new Date().getDay()];

    rest = !day;
  } else {
    var last = (b.sessions || [])[0], idx = 0;
    if (last) { var i = p.map(function (d) { return d.id; }).indexOf(last.dayId); idx = i >= 0 ? (i + 1) % p.length : 0; }
    day = p[idx];
  }
  var doneToday = (b.sessions || []).some(function (s) { return s.date === ymd() && (!day || s.dayId === day.id); });
  return { day: day, rest: rest, doneToday: doneToday };
}
function lastSets(exId) { var l = S.boot.last[exId]; return l ? l.sets : []; }
function calcT(u, w, act) {
  var base = 10 * w + 6.25 * u.height - 5 * u.age + (u.gender === 'female' ? -161 : 5);
  var adj = { cut: -500, bulk: 300, maintain: 0 }[u.goal] || 0;
  return { cal: Math.round((base * act + adj) / 10) * 10, prot: Math.round(w * (u.goal === 'bulk' ? 1.8 : 2)) };
}

}

}

}

/** نصايح الجلسة الجاية */
/**
 * نصيحة المرة الجاية لكل تمرين (نفس قواعد الوزن المقترح في وحدة الحسابات).
 * الجلسة الحالية = «آخر مرة»، والجلسة اللي قبلها = S.boot.last (ما انحفظت الحالية للحين).
 */
function buildTips(items) {
  var out = [], beg = isBeginner();
  items.forEach(function (it) {
    var e = exOf(it.exId), work = it.rows.filter(function (r) { return r.done && !r.wu; });
    if (!work.length) return;
    var t = it.target, n = work.length, tip;
    var mxW = Math.max.apply(null, work.map(function (r) { return +r.w || 0; }));
    var allTop = work.every(function (r) { return +r.r >= t.max; });
    var anyLow = work.some(function (r) { return +r.r < t.min; });
    if (isTime(e)) {
      tip = allTop ? ['up', 'زد 10 ثواني، هدفك ' + (t.max + 10) + ' ثانية'] : ['keep', 'حاول توصل ' + t.max + ' ثانية في كل المجموعات'];
    } else if (!mxW) {
      tip = allTop ? ['up', 'ممتاز! زد عدّتين، أو أضف وزن خفيف'] : ['keep', 'حاول توصل ' + t.max + ' عدّة في كل المجموعات'];
    } else {
      var cur = { sets: work.map(function (r) { return { w: +r.w || 0, r: +r.r || 0 }; }) };
      var sg = Calc.suggest(e, { sets: t.sets, min: t.min, max: t.max, inc: t.inc }, cur, (S.boot.last || {})[it.exId], { beginner: beg });
      if (sg.mode === 'up') tip = ['up', 'جرّب ' + fw(sg.w) + ' كجم المرة الجاية (زيادة ' + fw(sg.step) + ' كجم)'];
      else if (sg.mode === 'down') tip = ['down', 'خفّف المرة الجاية لـ ' + fw(sg.w) + ' كجم، لأن عدّاتك نزلت تحت ' + t.min + ' جلستين ورا بعض'];
      else if (sg.mode === 'repeat') tip = ['keep', 'كرّر ' + fw(sg.w) + ' كجم المرة الجاية. أول أسبوعين نثبّت الأساس'];
      else if (anyLow) tip = ['keep', 'ثبّت ' + fw(mxW) + ' كجم، وحاول توصل ' + t.min + ' عدّات على الأقل في كل مجموعة'];
      else tip = ['keep', 'كمّل على ' + fw(mxW) + ' كجم لين توصل ' + t.max + ' عدّة في كل المجموعات'];
    }
    if (n < t.sets) tip[1] += '. سجّلت ' + n + ' من ' + t.sets + ' مجموعات';
    out.push({ name: it.name, kind: tip[0], text: tip[1] });
  });
  return out;
}

  if (pq) return '<div class="v-note">' + ic('cloud-upload') + '<span class="grow">' + (pq === 1 ? 'جلسة وحدة محفوظة' : pq + ' جلسات محفوظة') + ' على جوالك، بتنرسل لما يرجع النت</span><button class="v-chip" data-act="retryQueue">أرسلها</button></div>';
  var inst = installCard(true);
  if (inst) return inst;
  return pushCard() || '';
}

/** بطاقة اليوم */
function todayCard(h) {
  var c = h.card, d = S.draft;
  if (d) {
    var t = sessTotals();
    return '<section class="tcard train"><div class="tc-sub">تمرينك شغّال</div><div class="tc-title en">' + esc(d.dayName) + '</div>' +
      '<div class="tc-meta">' + t.done + ' من ' + t.tot + ' مجموعة · <span class="en" data-elapsed="' + d.startedAt + '">' + fmtDur(Date.now() - d.startedAt) + '</span></div>' +
      '<button class="tc-go" data-act="resume">كمّل تمرينك ' + ic('player-play-filled') + '</button></section>';
  }
  if (S.af && S.af.ctx === 'solo' && S.af.start && !S.af.end) {
    return '<section class="tcard rest"><div class="tc-sub">الكارديو شغّال</div><div class="tc-title">' + esc(afName(S.af)) + '</div>' +
      '<div class="tc-meta en" data-elapsed="' + S.af.start + '">' + fmtDur(Date.now() - S.af.start) + '</div>' +
      '<button class="tc-go" data-act="afResume">كمّل ' + ic('player-play-filled') + '</button></section>';
  }

    var pc = Math.min(100, Math.round(c.weekMin / c.goalMin * 100));
    return '<section class="tcard rest cm"><div class="tc-sub">نشاطك اليوم</div>' +
      ((c.acts || []).length ? '<div class="tc-opts done">' + c.acts.map(function (x) { return '<span>' + ic('check') + ' ' + esc(x.dayName) + ' ' + x.duration + ' د</span>'; }).join('') + '</div>' : '') +
      '<div class="tc-meta">' + c.weekMin + ' من ' + c.goalMin + ' دقيقة هالأسبوع · ' + c.days + ' من ' + daysAr(c.target) + '</div><div class="cm-bar"><i style="width:' + pc + '%"></i></div>' +
      '<div class="tc-2"><button class="tc-go" data-act="cardioStart">ابدأ الكارديو ' + ic('player-play-filled') + '</button><button class="tc-ghost" data-act="otherAct">سجّل نشاط</button></div></section>';
  }
  if (!(S.boot.program || []).length) {
    return '<section class="tcard train"><div class="tc-sub">خطوتك الأولى</div><div class="tc-title">اختر برنامجك</div>' +
      '<div class="tc-meta">صمّم برنامجك بنفسك، أو اختر برنامج جاهز وعدّل عليه</div>' +
      '<button class="tc-go" data-act="go" data-to="choose">اختر برنامج ' + ic('chevron-left') + '</button></section>';
  }
  var dayLbl = 'اليوم · ' + WD[new Date().getDay()];
  if (c.type === 'train') {
    var cp = c.cardio || {}, cl = cp.before ? 'قبلها ' + cp.before.txt : cp.after ? 'بعدها ' + cp.after.txt : '';
    var hint = '';
    if (h.isNew) hint = 'ابدأ بوزن خفيف، وبنضبطه معك من الجلسة الجاية';
    else if (c.hint) {
      var x = c.hint, nm = '<span class="en">' + esc(x.name) + '</span>';
      hint = x.mode === 'up' ? nm + ': آخر مرة ' + fw(x.last) + ' كجم · جرّب اليوم ' + fw(x.w) :
        x.mode === 'down' ? nm + ': آخر مرة ' + fw(x.last) + ' كجم · خفّف اليوم لـ ' + fw(x.w) :
          nm + ': آخر مرة ' + fw(x.last) + ' كجم · كرّر نفس الوزن';
    }
    return '<section class="tcard train"><div class="tc-head"><div><div class="tc-sub">' + (h.isNew ? 'أول تمرين لك · ' + WD[new Date().getDay()] : dayLbl) + '</div>' +
      '<div class="tc-title en">' + esc(c.name) + '</div></div>' +
      (h.isNew ? '' : '<button class="tc-edit" data-act="go" data-to="day" data-p=\'' + pj({ id: c.dayId }) + '\'>' + ic('pencil') + 'تعديل اليوم</button>') + '</div>' +
      '<div class="tc-meta">' + exCount(c.count) + ' · ' + c.estMin + ' د' + (cl ? ' · ' + cl : '') + (c.done ? ' · أنجزته اليوم ✅' : '') + '</div>' +
      (hint ? '<div class="tc-hint">' + hint + '</div>' : '') +
      '<button class="tc-go" data-act="startDay" data-day="' + esc(c.dayId) + '">' + (h.isNew ? 'ابدأ أول تمرين' : 'ابدأ التمرين') + ' ' + ic('player-play-filled') + '</button></section>';
  }
  var tmr = nextTrainName();
  if (c.type === 'full-rest') {
    return '<section class="tcard rest full"><div class="tc-head"><div><div class="tc-sub">' + dayLbl + '</div><div class="tc-title">راحة كاملة</div></div></div>' +
      '<div class="tc-meta">جسمك يبني العضل الحين. نام زين واشرب موي' + (tmr ? ' · بكرة <span class="en">' + esc(tmr) + '</span>' : '') + '</div>' +
      ((c.acts || []).length ? '<div class="tc-opts done">' + c.acts.map(function (x) { return '<span>' + ic('check') + ' ' + esc(x.dayName) + ' ' + x.duration + ' د</span>'; }).join('') + '</div>' : '') +
      '<button class="tc-ghost" data-act="otherAct">تبي تتحرك؟ سجّل نشاط خفيف</button></section>';
  }
  return '<section class="tcard rest"><div class="tc-head"><div><div class="tc-sub">' + dayLbl + '</div><div class="tc-title">راحة نشطة</div></div>' +
    '<span class="tc-pill">خفيف: تقدر تسولف</span></div>' +
    '<div class="tc-meta">جهد 3–5 من 10 · يسرّع استرجاعك' + (tmr ? ' لـ <span class="en">' + esc(tmr) + '</span> بكرة' : '') + '</div>' +
    ((c.acts || []).length ? '<div class="tc-opts done">' + c.acts.map(function (x) { return '<span>' + ic('check') + ' ' + esc(x.dayName) + ' ' + x.duration + ' د</span>'; }).join('') + '</div>' :
      '<div class="tc-opts"><span>مشي مائل 30–40 د</span><span>أو دراجة 30 د</span></div>') +
    '<div class="tc-2"><button class="tc-go" data-act="cardioStart">ابدأ الكارديو ' + ic('player-play-filled') + '</button><button class="tc-ghost" data-act="otherAct">نشاط آخر</button></div></section>';
}
function nextTrainName() {
  var sch = (S.boot.settings || {}).schedule || {}, wd = (new Date().getDay() + 1) % 7, d = sch[wd] && (S.boot.program || []).filter(function (x) { return x.id === sch[wd]; })[0];
  return d ? d.name : '';
}

/** شريط الأسبوع وملخصه */
function weekCard(h) {
  var days = h.week.map(function (w) {
    var sch = (S.boot.settings.schedule || {})[w.wd], d = sch && (S.boot.program || []).filter(function (x) { return x.id === sch; })[0];
    var name = w.state === 'rest-today' ? 'اليوم' : d ? d.name : 'راحة';
    if (h.cardioMode) { var mn = (S.boot.sessions || []).filter(function (x) { return x.date === w.date; }).reduce(function (a, x) { return a + (+x.duration || 0); }, 0); name = mn ? mn + ' د' : w.date === h.today ? 'اليوم' : '—'; d = null; }
    var cls = w.done ? 'w-done' : w.act ? 'w-act' : w.state === 'today' ? 'w-today' : w.state === 'rest-today' ? 'w-rt' : w.plan ? (w.state === 'missed' ? 'w-missed' : 'w-plan') : 'w-rest';
    return '<div class="wk-d ' + cls + '"><span class="wk-l">' + WD1[w.wd] + '</span><span class="wk-c">' + (w.done || w.act ? ic('check') : '') + '</span><span class="wk-n ' + (d ? 'en' : '') + ' ell">' + esc(name) + '</span></div>';
  }).join('');
  var s = h.weekSum;
  if (h.cardioMode) return '<section class="v-card wk"><div class="wk-g">' + days + '</div>' + (h.show.weekSum ?
    '<div class="wk-s"><div><b>' + h.card.weekMin + ' د</b><span>نشاطك</span></div><div><b>' + h.card.days + '/' + h.card.target + '</b><span>أيام</span></div><div><b>' + h.card.goalMin + ' د</b><span>هدفك</span></div></div>' : '') + '</section>';
  return '<section class="v-card wk"><div class="wk-g">' + days + '</div>' + (h.show.weekSum ?
    '<div class="wk-s"><div><b>' + s.min + ' د</b><span>تمرين</span></div><div><b>' + fmtN(s.volume) + '</b><span>كجم مرفوعة</span></div><div><b>' + s.cardioMin + ' د</b><span>كارديو</span></div></div>' : '') + '</section>';
}

function tiles3(h) {
  var st = S.boot.settings || {}, g = goalOf(), lvl = st.level;
  if (g === 'cut' && lvl === 'beginner') g = 'recomp';
  var goal;
  if (st.goalStart && st.goalWeeks) {
    var wk = Math.min(+st.goalWeeks, Math.max(1, Math.floor(daysBetween(st.goalStart, ymd()) / 7) + 1));
    goal = '<div class="v-tile"><span class="vt-l">الهدف · ' + GOAL_AR[g] + '</span><b>أسبوع ' + wk + '/' + st.goalWeeks + '</b><div class="vt-bar"><i style="width:' + Math.round(wk / st.goalWeeks * 100) + '%"></i></div></div>';
  } else goal = '<div class="v-tile"><span class="vt-l">هدفك</span><b>' + GOAL_AR[g] + '</b>' + (st.goalWeeks ? '<span class="vt-s">خطة ' + st.goalWeeks + ' أسابيع</span>' : '') + '</div>';
  var w = h.weight, wt;
  if (w) wt = '<button class="v-tile" data-act="quickWeight"><span class="vt-l">وزنك</span><b>' + fw(w.now) + '</b><span class="vt-s ' + (w.dir === 'down' ? 'g' : w.dir === 'up' ? 'o' : '') + '">' + (w.dir === 'down' ? '↓ ' + Math.abs(w.delta) + ' أسبوعيًا' : w.dir === 'up' ? '↑ ' + w.delta + ' أسبوعيًا' : w.dir === 'flat' ? 'ثابت' : 'كجم') + '</span></button>';
  else wt = '<button class="v-tile" data-act="quickWeight"><span class="vt-l">وزنك</span><b>—</b><span class="vt-s b-l">سجّل وزنك</span></button>';
  var f = h.food;
  var food = '<button class="v-tile" data-act="macros"><span class="vt-l">سعرات أكلك المقترحة</span><b>' + (f ? fmtN(f.kcal) : '—') + '</b><span class="vt-s">' + (f ? 'بروتين ' + f.protein + ' جم' : 'كمّل بياناتك') + '</span></button>';
  return '<div class="v-tiles ' + (h.isNew ? 't2' : 't3') + '">' + goal + (h.isNew ? '' : wt) + food + '</div>';
}

function tiles2(h) {
  var out = [], ls = h.lastSession;
  if (h.show.pr) out.push('<button class="v-tile vt-pr" data-act="tabgo" data-to="progress"><span class="vt-i">' + ic('trophy') + '</span><span class="vt-t"><span class="vt-l o">رقم قياسي</span><b class="en ell">' + esc(h.pr.name) + ' ' + fw(h.pr.w) + '</b></span></button>');
  if (h.show.friends) {
    var f = h.friends[0];
    out.push('<div class="v-tile row2 fr-t"><button class="plain fr-l" data-act="go" data-to="friends"><span class="vt-av">' + esc(String(f.name || '؟').slice(0, 1)) + '</span><span class="vt-t"><span class="vt-l ell">' + esc(f.name) + ' · ' + agoDay(f.date) + '</span><b class="ell en">' + esc(f.day || '') + '</b></span></button>' + cheerBtn(f.id, f.ch, true) + '</div>');
  }
  if (out.length < 2 && ls) out.push('<button class="v-tile row2" data-act="go" data-to="history"><span class="vt-i n">' + ic('history') + '</span><span class="vt-t"><span class="vt-l">آخر جلسة · ' + agoDay(ls.date) + '</span><b class="ell"><span class="en">' + esc(ls.dayName || 'تمرين') + '</span> · ' + ls.duration + ' د</b></span></button>');
  return out.length ? '<div class="v-tiles t2">' + out.slice(0, 2).join('') + '</div>' : '';
}
/** زر «شجّعه»: مرة وحدة في اليوم لكل صاحب */
function cheeredToday(id, ch) { var m = LS.get('cheered', {}) || {}; return !!ch || m[id] === ymd(); }
function cheerBtn(id, ch, small) {
  if (cheeredToday(id, ch)) return '<span class="v-chip fr-ok' + (small ? ' sm' : '') + '" aria-label="شجّعته">' + ic('check') + (small ? '' : 'شجّعته') + '</span>';
  return '<button class="v-chip fr-go' + (small ? ' sm' : '') + '" data-act="cheer" data-id="' + esc(id) + '" aria-label="شجّعه">' + (small ? '💪' : 'شجّعه 💪') + '</button>';
}
function agoDay(d) { var n = daysBetween(d, ymd()); return n <= 0 ? 'اليوم' : n === 1 ? 'أمس' : 'قبل ' + daysAr(n); }

var SETUP_STEPS = [['plan', 'حدد هدفك وخطتك', 'onboard'], ['tools', 'اختر أدواتك المتوفرة', 'onboard'], ['first', 'سجّل أول تمرين', ''], ['friend', 'أضف صديق يتمرن معك', 'friends']];
function setupCard(h, small) {
  var st = h.setup.steps, done = SETUP_STEPS.filter(function (x) { return st[x[0]]; }).length;
  if (small) {
    var nx = SETUP_STEPS.filter(function (x) { return !st[x[0]]; })[0];
    return '<div class="v-card setup1"><span class="grow"><span class="vt-l">باقي لك في بدايتك (' + done + ' من 4)</span><b>' + nx[1] + '</b></span>' + (nx[2] ? '<button class="v-chip" data-act="go" data-to="' + nx[2] + '">ابدأ</button>' : '') + '</div>';
  }
  return '<section class="v-card setup"><div class="row between"><b>بدايتك في نِدّ</b><span class="vt-l">' + done + ' من 4</span></div>' +
    SETUP_STEPS.map(function (x, i) {
      var ok = st[x[0]], cur = !ok && SETUP_STEPS.slice(0, i).every(function (y) { return st[y[0]]; });
      return '<div class="su ' + (ok ? 'su-ok' : cur ? 'su-cur' : '') + '"><span class="su-c">' + (ok ? ic('check') : '') + '</span><span class="grow">' + x[1] + '</span>' +
        (!ok && x[0] === 'friend' ? '<button class="v-chip" data-act="go" data-to="friends">أضف</button>' : '') + '</div>';
    }).join('') + '</section>';
}

SC.home = function () {
  var b = S.boot, u = b.user, h = homeModel();
  var first = String(u.name || '').split(' ')[0];
  var greet = h.isNew ? 'أهلًا فيك' : new Date().getHours() < 12 ? 'صباح الخير' : 'مساء الخير';
  var badge = h.show.streak ? '<span class="v-badge fire">' + ic('flame') + weeksStreak(h.streak) + '</span>' : h.firstWeek ? '<span class="v-badge new">أسبوعك الأول</span>' : '';
  var chl = cheerLine();
  var head = '<header class="v-head"><div><div class="vh-g' + (chl ? ' cheer' : '') + '">' + (chl || greet) + '</div><div class="vh-n">' + esc(first) + '</div></div>' + badge + '</header>';
  var body;
  if (h.isNew) {
    var plan = (b.settings.programName || '') ;
    var nd = Object.keys(b.settings.schedule || {}).filter(function (k) { return b.settings.schedule[k]; }).length;
    body = todayCard(h) + tiles3(h) + setupCard(h) +
      ((b.program || []).length ? '<button class="v-card plan1" data-act="tabgo" data-to="program"><span class="vt-i n">' + ic('calendar') + '</span><span class="grow ell"><span class="vt-l">خطتك: </span><b>' + (plan ? '<span class="en">' + esc(plan) + '</span> · ' : '') + (nd ? daysAr(nd) + ' تمرين' : 'رتّب أيامك') + '</b></span>' + ic('chevron-left', 'mut') + '</button>' : '');
  } else {
    // أول أسبوعين: «بدايتك في نِدّ» تاخذ مكان مربع «آخر جلسة» عشان الرئيسية تبقى بدون تمرير
    var t2 = h.setup.visible && !h.show.pr && !h.show.friends ? '' : tiles2(h);
    body = todayCard(h) + weekCard(h) + tiles3(h) + t2 + (h.setup.visible ? setupCard(h, true) : '');
  }
  if (h.food && h.food.refresh && !S.refreshing) {
    S.refreshing = 1;
    setTimeout(function () { S.refreshing = 0; saveSettingsLocal({ calcW: h.food.calcW }); toast('وزنك تغيّر 2 كجم، وحدّثنا سعراتك المقترحة: ' + fmtN(h.food.kcal)); render(); }, 0);
  }
  return '<div class="v-home">' + head + homeNote() + body + '</div>' + nav('home');
};

/* ---------- نافذة: سعرات أكلك المقترحة (الشاشة ٨) ---------- */

  var diff = f.tdee - f.kcal, nd = h.target, active = !!st.active;

  return '<div class="v3 vsheet"><div class="vs-h"><div><span class="vt-l">سعرات أكلك المقترحة</span><div class="vs-big">' + fmtN(f.kcal) + ' <small>سعرة يوميًا</small></div></div>' +
    '<button class="vs-x" data-act="closeSheet" aria-label="إغلاق">' + ic('x') + '</button></div>' +
    '<div class="vs-calc"><div><span>احتياجك اليومي</span><b>' + fmtN(f.tdee) + '</b></div>' +
    (f.pct ? '<div><span>هدفك ' + GOAL_AR[f.goal] + ' (' + (f.pct > 0 ? '+' : '−') + Math.round(Math.abs(f.pct) * 100) + '%)</span><b class="' + (f.pct < 0 ? 'o' : 'g') + '">' + (diff > 0 ? '− ' : '+ ') + fmtN(Math.abs(diff)) + '</b></div>' : '<div><span>هدفك ' + GOAL_AR[f.goal] + '</span><b>بدون عجز</b></div>') +
    '<div class="tot"><span>المقترح لك</span><b>' + fmtN(f.kcal) + '</b></div>' +

    (f.floor ? '<p class="o">ما ننزل الاقتراح تحت ' + fmtN(f.kcal) + ' سعرة عشان صحتك</p>' : '') + '</div>' +

      return '<button class="' + (k === style ? 'on' : '') + '" data-act="foodStyle" data-v="' + k + '" aria-pressed="' + (k === style) + '">' + STYLE_AR[k] + '</button>';
    }).join('') + '</div></div>' +
    '<div><b class="vs-t">تقسيمها</b><div class="vs-bar"><i style="width:' + pc(f.kP) + '%;background:#FF4D8D"></i><i style="width:' + pc(f.kF) + '%;background:#FFB547"></i><i style="width:' + pc(f.kC) + '%;background:#12B5FF"></i></div>' +
    '<div class="vs-m"><div class="p"><span>بروتين</span><b>' + f.protein + ' <small>جم</small></b><span class="vt-l">' + fmtN(f.kP) + ' سعرة</span></div>' +
    '<div class="f"><span>دهون</span><b>' + f.fat + ' <small>جم</small></b><span class="vt-l">' + fmtN(f.kF) + ' سعرة</span></div>' +
    '<div class="c"><span>كارب</span><b>' + f.carbs + ' <small>جم</small></b><span class="vt-l">' + fmtN(f.kC) + ' سعرة</span></div></div>' +
    '<p class="vt-l">نفس الأرقام في أيام التمرين والراحة · تتحدث لحالها إذا تغيّر وزنك 2 كجم</p></div>' +
    (f.warn.indexOf('keto_perf') >= 0 ? '<p class="vs-warn">الكيتو ممكن يقلل أداءك في التمارين القوية أول أسابيع.</p>' : '') +
    (f.warn.indexOf('doctor') >= 0 ? '<p class="vs-warn">إذا عندك سكري أو مشكلة في الكلى، استشر طبيبك قبل.</p>' : '') +

}

/* ===================== أسئلة البداية (الخطوة ٥) ===================== */
var OB_GOALS = [['cut', 'تنشيف', 'تنزل دهون وتحافظ على عضلك'], ['lose', 'إنقاص وزن', 'تنزل وزنك بشكل أوضح'], ['bulk', 'تضخيم', 'تبني عضل وتزيد قوتك'], ['fit', 'لياقة وصحة', 'تحافظ على وزنك وتتحسن صحتك']];
var OB_LEVELS = [['beginner', 'مبتدئ', 'أقل من 6 شهور تمرين منتظم'], ['intermediate', 'متوسط', 'من 6 شهور إلى سنتين'], ['advanced', 'متقدم', 'أكثر من سنتين']];
var OB_TOOLS = [['machine', 'أجهزة', 'adjustments'], ['cable', 'كيبل', 'link'], ['dumbbell', 'دمبل', 'barbell'], ['barbell', 'بار', 'weight']];
/** يحتاج أسئلة البداية: ما جاوبها، وما عنده برنامج */
/** وش ينقصه: new = مستخدم جديد بدون برنامج، mig = مستخدم من النسخة القديمة (عنده برنامج أو سجل) */
function obNeed() {
  var b = S.boot;
  if (!b || !b.user || (b.settings || {}).onboarded) return '';
  return (b.program || []).length || (b.sessions || []).length ? 'mig' : 'new';
}
function needsOnboard() { return !!obNeed(); }
function obInit(edit) {
  var b = S.boot, st = b.settings || {}, u = b.user || {}, lw = latestWeight();

  var g = st.goal || { cut: 'cut', bulk: 'bulk', maintain: 'fit' }[u.goal] || '';
  var nd = +st.days || trainDays();
  S.ob = {
    step: 1, edit: !!edit, mig: mig, mode: st.mode === 'cardio' ? 'cardio' : '',

    tools: (st.tools && st.tools.length ? st.tools : ['machine', 'cable', 'dumbbell', 'barbell']).slice(),
    gender: u.gender || 'male', age: +u.age || '', height: +u.height || '', weight: lw || +u.startWeight || '', active: !!+st.active,
    tpl: '', keep: !!((edit || mig) && (b.program || []).length && st.mode !== 'cardio'), all: false,
    // الترحيل: البيانات تنسأل بس إذا ناقصة
    needData: !mig || !(+u.age && +u.height && (lw || +u.startWeight))
  };
}
/** خطوات الأسئلة حسب الحالة */
function obSteps() {
  var o = S.ob;
  if (o.mig) return ['goal', 'level', 'tools'].concat(o.needData ? ['data'] : [], ['plan']);
  return o.mode === 'cardio' ? ['goal', 'level', 'days', 'data', 'plan'] : ['goal', 'level', 'days', 'tools', 'data', 'plan'];
}
function obKey() { return obSteps()[S.ob.step - 1]; }
/** يقرأ خانات شاشة البيانات قبل أي إعادة رسم */
function obRead() {
  if (!S.ob || obKey() !== 'data') return;
  if ($('obAge')) S.ob.age = +val('obAge') || '';
  if ($('obH')) S.ob.height = +val('obH') || '';
  if ($('obW')) S.ob.weight = r1(+val('obW')) || '';
}
function obTpl(id) { return (S.boot.templates || []).filter(function (t) { return t.id === id; })[0]; }
function obTplDays(t) { return t && t.sched ? Object.keys(t.sched).map(Number).sort() : []; }
function obOpt(act, v, on, title, sub) {
  return '<button class="ob-opt' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + !!on + '"><b>' + title + '</b>' + (sub ? '<span class="vt-l">' + sub + '</span>' : '') + '</button>';
}
var OB_NEWS = '<div class="ob-news"><b>نِدّ تحدّث 🎉</b><ul><li>جلسة أوضح، والوزن المقترح يزيد لحاله لما تكمّل عدّاتك</li><li>برامج جاهزة تتكيّف على أدوات ناديك، وسعرات أكلك المقترحة</li><li>سجّل الكارديو والأنشطة، وشجّع أصحابك 💪</li></ul><span class="vt-l">سجلك وأرقامك القياسية محفوظة كاملة.</span></div>';
SC.onboard = function () {
  if (!S.ob) obInit((S.boot.program || []).length > 0 && !obNeed());
  var o = S.ob, steps = obSteps(), n = o.step, key = steps[n - 1], total = steps.length - 1, body = '', foot = '';
  var head = '<div class="ob-top">' + (n > 1 || o.edit ? '<button class="icon-btn" data-act="obBack" aria-label="رجوع">' + ic('arrow-right') + '</button>' : '<span></span>') +
    (n <= total ? '<div class="ob-dots">' + steps.slice(0, total).map(function (x, i) { return '<i class="' + (i + 1 < n ? 'd' : i + 1 === n ? 'c' : '') + '"></i>'; }).join('') + '</div><span class="vt-l">' + n + ' من ' + total + '</span>' : '<span></span>') + '</div>';
  var cardio = o.mode === 'cardio';
  if (key === 'goal') {
    body = (o.mig ? OB_NEWS + '<h1 class="ob-h">حدّث خطتك: وش هدفك؟</h1>' : '<h1 class="ob-h">وش هدفك؟</h1>') + '<div class="ob-list">' + OB_GOALS.map(function (g) { return obOpt('obGoal', g[0], o.goal === g[0], g[1], g[2]); }).join('') + '</div>';
  } else if (key === 'level') {

    foot = '<button class="v-btn" data-act="obNext"' + (o.tools.length ? '' : ' disabled') + '>التالي</button>';
  } else if (key === 'data') {

    body = '<h1 class="ob-h">بياناتك</h1><p class="vt-l">نحسب منها سعرات أكلك المقترحة.</p>' +

      '<b class="vs-t">طبيعة يومك</b><div class="ob-seg">' + obOpt('obActive', '0', !o.active, 'هادي', 'أغلب يومك جالس') + obOpt('obActive', '1', o.active, 'نشيط', 'أغلب يومك تتحرك') + '</div>';

/** حفظ إعدادات الخطة: تبان فورًا، وتنرسل عبر صندوق الصادر */

  var cur = S.queue.filter(function (q) { return q.key === 'settings'; })[0];

/* ---------- برنامجي (الشاشة ٤) ---------- */
SC.program = function () {
  var b = S.boot, p = b.program || [];
  if (!p.length) return SC.choose();
  var sch = b.settings.schedule || {}, today = new Date().getDay(), ws = Calc.weekStart(ymd());
  var done = {};
  (b.sessions || []).forEach(function (s) { if (s.date >= ws) done[s.dayId + '|' + daysBetween(ws, s.date)] = 1; });
  var nd = Object.keys(sch).filter(function (k) { return sch[k]; }).length;
  var cov = typeof coverageOf === 'function' ? coverageOf(p) : null;
  var rows = [0, 1, 2, 3, 4, 5, 6].map(function (i) {
    var d = p.filter(function (x) { return x.id === sch[i]; })[0];
    if (!d) {
      var full = i === 6;
      return '<button class="pd rest" data-act="schedPick" data-wd="' + i + '"><span class="grow"><span class="vt-l">' + WD[i] + '</span><b>' + (full ? 'راحة كاملة' : 'راحة نشطة') + '</b><span class="vt-l">' + (full ? 'استرجاع' : 'مشي خفيف 30–40 د') + '</span></span>' + ic('chevron-left', 'mut') + '</button>';
    }
    var isT = i === today, ok = done[d.id + '|' + i];
    return '<button class="pd ' + (isT ? 'today' : '') + '" data-act="go" data-to="day" data-p=\'' + pj({ id: d.id }) + '\'><span class="grow"><span class="vt-l">' + WD[i] + '</span><b class="en">' + esc(d.name) + '</b><span class="vt-l">' + exCount(d.items.length) + ' · ' + estMin(d) + ' د</span></span>' +
      (ok ? '<span class="pd-tag tg-ok">تم</span>' : isT ? '<span class="pd-tag t">اليوم</span>' : '') + ic('chevron-left', 'mut') + '</button>';
  }).join('');
  var unsched = p.filter(function (d) { return !Object.keys(sch).some(function (k) { return sch[k] === d.id; }); });
  return '<div class="v-prog"><header class="v-head"><div><div class="vh-n">برنامجي</div><div class="vh-g">' + (b.settings.programName ? '<span class="en">' + esc(b.settings.programName) + '</span> · ' : '') + (nd ? daysAr(nd) + ' تمرين' : 'رتّب أيامك على الأسبوع') + '</div></div>' +
    '<button class="v-chip lg" data-act="go" data-to="choose">تغيير البرنامج</button></header>' +
    (cov ? (cov.ok ? '<div class="cov cov-ok"><span class="su-c">' + ic('check') + '</span><span>برنامجك يغطي كل العضلات</span></div>' :

    '<div class="pd-list">' + rows + '</div>' +
    (unsched.length ? '<div class="vt-l" style="margin-top:6px">أيام بدون موعد في الأسبوع (اضغط على أي يوم راحة عشان تحطها فيه)</div><div class="pd-list">' + unsched.map(function (d) {
      return '<button class="pd" data-act="go" data-to="day" data-p=\'' + pj({ id: d.id }) + '\'><span class="grow"><b class="en">' + esc(d.name) + '</b><span class="vt-l">' + exCount(d.items.length) + ' · ' + estMin(d) + ' د</span></span>' + ic('chevron-left', 'mut') + '</button>';
    }).join('') + '</div>' : '') +

/* ---------- المكتبة ---------- */

  var pick = p.pick, m = S.libM;

  var list = all.filter(function (e) { return !m || e.muscle === m; });
  return topbar(pick ? (p.swap != null ? 'اختر البديل' : 'أضف تمرين') : 'مكتبة التمارين') +

function edSave() {

var DRAG = null;
document.addEventListener('pointerdown', function (ev) {
  var h = ev.target.closest && ev.target.closest('[data-drag-h]');
  if (!h) return;
  var row = h.closest('[data-drag]');
  if (!row) return;
  ev.preventDefault();
  DRAG = { ctx: row.dataset.drag, from: +row.dataset.i, to: +row.dataset.i, row: row, y0: ev.clientY, rows: [].slice.call(row.parentNode.querySelectorAll('[data-drag]')) };
  DRAG.mids = DRAG.rows.map(function (x) { var b = x.getBoundingClientRect(); return b.top + b.height / 2; });
  row.classList.add('dragging');
  try { h.setPointerCapture(ev.pointerId); } catch (x) {}
});
document.addEventListener('pointermove', function (ev) {
  if (!DRAG) return;
  var dy = ev.clientY - DRAG.y0, y = DRAG.mids[DRAG.from] + dy, to = 0;
  DRAG.mids.forEach(function (m, k) { if (y > m) to = k; });
  if (y < DRAG.mids[0]) to = 0;
  DRAG.to = to;
  DRAG.row.style.transform = 'translateY(' + dy + 'px)';
});
function dragEnd() {
  if (!DRAG) return;
  var g = DRAG; DRAG = null;
  g.row.classList.remove('dragging'); g.row.style.transform = '';
  if (g.to === g.from) return;
  var r = itemRef(g.ctx, g.from);
  if (!r) return;
  var it = r.list.splice(g.from, 1)[0];
  r.list.splice(g.to, 0, it);
  if (g.ctx === 'sess') { var d = S.draft, cur = d.items[d.cur]; d.cur = Math.max(0, d.items.indexOf(cur)); saveDraft(); }
  else saveProg();
  render();
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);

    var m = mm[i];
    if (!any && m && m.ok) { any = true; m.rows.forEach(function (r) { if (!r.wu) { vol += (+r.w || 0) * (+r.r || 0); sets++; } }); }
    if (!any) missing++;

  sess.forEach(function (s) { vol += s.volume; sets += s.sets; });

    for (i = 0; i < 7; i++) {

      sess.forEach(function (s) { if (s.date === k) v += s.volume; });

function doSwap(ctx, i, id) {
  var r = itemRef(ctx, i), e = S.ex[id];
  if (!r || !e) return render();
  if (ctx === 'prog') {
    r.it.ex = id; delete r.it.from; delete r.it.fb; render(); saveProg('تم التبديل إلى ' + e.name); return;
  }
  var d = S.draft, it = r.it;
  if (!it.rows.some(function (x) { return x.done; })) {
    var n = it.rows.length;
    it.exId = id; it.name = e.name; it.rows = makeRows(id, n);
  } else {
    var left = it.rows.filter(function (x) { return !x.done; }).length || 1;
    it.rows = it.rows.filter(function (x) { return x.done; }); it.target.sets = it.rows.length;
    d.items.splice(i + 1, 0, sessItem(id, { sets: left, min: it.target.min, max: it.target.max }));
    d.cur = i + 1;
  }
  d.restEnd = null; saveDraft(); S.params = {}; render(); window.scrollTo(0, 0);
  toast('تم التبديل إلى ' + e.name);
}

function beginDay(day) {
  // المبتدئ أول أسبوعين: مجموعة أقل في العزل (للجلسة بس، البرنامج ما يتغيّر)
  var beg = isBeginner();
  var its = day.items.map(function (it) { return beg ? Object.assign({}, it, { sets: Calc.beginnerSets(exOf(it.ex), it.sets) }) : it; });
  var cplan = Calc.cardioPlan(Calc.dayKind(day, S.ex), goalOf());
  S.draft = {
    cplan: cplan, cardio: [],
    id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), dayId: day.id, dayName: day.name,
    date: ymd(), startedAt: Date.now(), cur: 0, restEnd: null, restTotal: +S.boot.settings.restSec || 90,
    orig: its.map(function (it) { return { ex: it.ex, sets: +it.sets, min: +it.min, max: +it.max }; }),
    items: its.map(function (it) { return sessItem(it.ex, it); })
  };
  saveDraft();
  schedForgot();
  go('session', { view: 'list' });
}

setInterval(function () {
  document.querySelectorAll('[data-elapsed]').forEach(function (el) { el.textContent = fmtDur(Date.now() - (+el.dataset.elapsed)); });
  if (S.sw && S.route === 'session') { var inp = $('rowR' + S.sw.row); if (inp) inp.value = Math.round((Date.now() - S.sw.start) / 1000); }
  var d = S.draft;
  if (S.route !== 'session' || !d || !d.restEnd) return;
  var rem = d.restEnd - Date.now();
  if (rem <= 0) {
    d.restEnd = null; saveDraft();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (err) {}
    toast('خلصت الراحة، يلا المجموعة الجاية 💪');
    if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render();
    return;
  }
  var t = $('restTxt'); if (t) t.textContent = fmtSec(Math.ceil(rem / 1000));
  var f = $('restFill'); if (f) f.style.width = (rem / (d.restTotal * 1000) * 100).toFixed(1) + '%';
}, 1000);

  return S.draft ? (S.draft.confirm ? 'confirm' : 'session') : S.af && S.af.start ? 'activity' : needsOnboard() ? 'onboard' : 'home';
}
function start() {
  render();
  if (!S.token) { setTimeout(function () { go('welcome', {}, { root: true }); }, 900); return; }
  if (S.boot) go(draftRoute(), S.draft && !S.draft.confirm ? { view: 'list' } : {}, { root: true });
  var q = S.queue.length ? flushQueue() : Promise.resolve();
  q.catch(function () {}).then(function () { return call('bootstrap', { etag: S.raw && S.raw.etag || '' }, { quiet: !!S.boot }); }).then(function (b) {
    setBoot(b);
    if (pushState() === 'on') pushLogin();
    var hr = String(location.hash || '').slice(1);
    if (['friends', 'progress', 'admin', 'me', 'notify'].indexOf(hr) >= 0 && !S.draft) {
      try { history.replaceState(null, '', location.pathname); } catch (x) {}
      if (hr === 'admin' && b.user.role !== 'admin') hr = 'home';
      go(hr, {}, { root: ['progress'].indexOf(hr) >= 0 });
    } else if (S.route === 'splash') go(draftRoute(), S.draft && !S.draft.confirm ? { view: 'list' } : {}, { root: true });
    else if (S.route === 'home' && needsOnboard()) go('onboard', {}, { root: true });
    else if (['home', 'program', 'progress', 'more'].indexOf(S.route) >= 0) render();
  }).catch(function (e) {
    if (!S.token) return;
    if (!S.boot) { go('login', {}, { root: true }); toast(e.message); }
    else toast('تعرض آخر بيانات محفوظة. ' + e.message);
  });
}
start();
})();
</script>
